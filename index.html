<script>

/* =========================================================================

const ITEM_FIELDS = ["cliente","codigo","desc","qtde","lote","validade","vencido","perecivel","danificado","giroScore","familia",
  "valorUnitario","reservado","ultimaEntrada","ultimaSaida","fornecedor","diasParadoFaixa"];

const PAL = {

  cardGrad:"linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(241,246,255,.96) 100%)",

/* =========================================================================
   COR POR GIRO (velocidade de movimentação do estoque)
   ========================================================================= */
function giroColor(g){
  const fast = new THREE.Color(0x2e8b57);
  const mid  = new THREE.Color(0xe8a13a);
  const slow = new THREE.Color(0xc0392b);
  const out  = new THREE.Color();
  return g < 0.5 ? out.copy(fast).lerp(mid, g*2) : out.copy(mid).lerp(slow, (g-0.5)*2);
}
const COLOR_VENCIDO_DANIFICADO = new THREE.Color(0xe63946); // vermelho sólido: vencido, danificado E a vencer (unificado a pedido)
const COLOR_VENCE_7D           = new THREE.Color(0xff8c1a); // laranja: usado só no contorno pulsante passivo (sem filtro ativo)
const COLOR_VENCE_15D          = new THREE.Color(0xf0c419); // amarelo: usado só no contorno pulsante passivo (sem filtro ativo)
const COLOR_CLIENTE_DESTAQUE   = new THREE.Color(0xffd400); // amarelo sólido de destaque do filtro Cliente
const COLOR_VAZIO              = new THREE.Color(0xffffff); // branco sólido para posições vazias
const COLOR_HOVER              = new THREE.Color(0xffffff);
const COLOR_SELECT             = new THREE.Color(0x2e6f77);
const COLOR_PALLET             = new THREE.Color(0xe3c99a); // madeira clara do palete — bem mais claro que o papelão
const COLOR_PAPELAO             = [ new THREE.Color(0xb5834a), new THREE.Color(0xa8763f), new THREE.Color(0xc2925c), new THREE.Color(0x9c6f3a) ]; // papelão mais escuro/saturado que o palete

// paleta do filtro Família — categorias REAIS da planilha (BRINDE, VESTUARIO,
// DISPLAY, PRODUTO, GRÁFICO). Cores sólidas distintas, no mesmo espírito visual
// da legenda por blocos de cor do PDF, mas aplicadas às categorias verdadeiras
// do WMS (a planta não amarra zona sanitária a posição, então não dá pra usar
// as cores dela sem inventar dados).
const FAMILIA_CORES = {
  "BRINDE":    "#2e8b57",
  "VESTUARIO": "#c9781f",
  "DISPLAY":   "#2255aa",
  "PRODUTO":   "#c2298a",
  "GRÁFICO":   "#3aa7a0",
  "":          "#888888"
};
function corFamilia(fam){
  return FAMILIA_CORES[fam] || "#888888";
}

// Zonas de produto da planta oficial (Processo PMB 059627/2026), LIDAS
// DIRETAMENTE da planta em alta resolução (Planta Pavimento Térreo, Galpão 07):
// ruas 01-03 = Alimentos (com um bolsão de Não Conformes e uma pequena faixa
// de Cosméticos no trecho final, perto dos eixos K-M); ruas 04-07 = Cosméticos
// (sobreposta pela "Área Segregada de Produtos Relacionados à Saúde"); rua 08 =
// dividida, metade Quarentena / metade Saneantes; ruas 09 em diante = Produtos
// Sem Interesse à Saúde (a grande maioria do galpão), com um bolsão de "Área
// Segregada (Alto Valor)" perto da divisa com o Galpão 10 (ruas ~28-29).
// A planilha de estoque não tem campo que amarre posição → zona sanitária,
// então a pintura de piso segue a ORDEM real das ruas (01, 02, 03...) lida na
// planta — não é mais uma proporção estimada, mas também não é confirmada
// posição-a-posição com o WMS.
// cores da grade da Visão 2D (status por posição) — paleta parecida com o
// padrão de mercado (verde=ocupado ok, cinza=vazio, vermelho=vencido,
// laranja=a vencer, roxo=danificado), reaproveitada também na legenda.
const STATUS2D_CORES = {
  ocupado:    "#2e8b57",
  vazio:      "#3a4046",
  vencido:    "#c0392b",
  aVencer:    "#e8a13a",
  danificado: "#8a4fb0"
};
const STATUS2D_LABELS = { ocupado:"Ocupado", vazio:"Vazio", vencido:"Vencido", aVencer:"A vencer ≤15d", danificado:"Danificado" };
const ZONA_CORES = {
  alimentos:     0x2e8b57,
  cosmeticos:    0xe08a2e,
  quarentena:    0xd633a6,
  saneantes:     0x3b6fd8,
  naoConformes:  0xd83030,
  altoValor:     0x9b59b6,
  semInteresse:  0x4fd1c5
};
function zonaPorIndiceRua(idx){
  // idx é 0-based (0 = primeira rua real, ex. "01")
  if(idx<3) return "alimentos";          // ruas 01-03
  if(idx<7) return "cosmeticos";         // ruas 04-07 (Área Segregada Saúde)
  if(idx===7) return "quarentena";       // rua 08 (metade quarentena/metade saneantes — ver nota)
  if(idx>=27 && idx<=28) return "altoValor"; // ruas ~28-29, bolsão Alto Valor
  return "semInteresse";                 // ruas 09+ (maioria do galpão)
}

/* =========================================================================
   ALERTA PREDITIVO DE VALIDADE
   Em vez de só marcar "vencido" quando já venceu, calculamos quantos dias
   faltam para o vencimento e classificamos em faixas de risco. Aceita datas
   em formato DD/MM/AAAA ou AAAA-MM-DD (cobre os formatos mais comuns de
   planilha/ERP brasileiro).
   ========================================================================= */
// helper tolerante: aceita true, "true", "TRUE", 1, "1" como verdadeiro
// (dados reais de planilha/ERP às vezes não vêm como booleano estrito)
function isTruthy(v){
  if(v === true || v === 1) return true;
  if(typeof v === "string") return v.trim().toLowerCase() === "true" || v.trim() === "1";
  return false;
}
function parseValidade(str){
  if(!str) return null;
  const s = String(str).trim();
  let d;
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    d = new Date(s.slice(0,10) + "T00:00:00");
  } else if(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)){
    const [dd,mm,yy] = s.split("/").map(Number);
    d = new Date(yy < 100 ? 2000+yy : yy, mm-1, dd);
  } else {
    return null;
  }
  return isNaN(d.getTime()) ? null : d;
}
const MS_DIA = 86400000;
function diasParaVencer(validadeStr, hoje){
  const d = parseValidade(validadeStr);
  if(!d) return null;
  return Math.round((d.getTime() - hoje.getTime()) / MS_DIA);
}
// classifica um item em: "vencido" | "critico" (<=7d) | "atencao" (<=15d) | null (ok/sem data)
function riscoValidadeItem(it, hoje){
  if(isTruthy(it[6])) return "vencido"; // já vencido conforme flag do sistema
  const dias = diasParaVencer(it[5], hoje);
  if(dias === null) return null;
  if(dias < 0) return "vencido";
  if(dias <= 7) return "critico";
  if(dias <= 15) return "atencao";
  return null;
}
// pior risco entre os itens de uma posição
function riscoValidadePosicao(itens, hoje){
  let pior = null;
  const ordem = { vencido:3, critico:2, atencao:1 };
  itens.forEach(it=>{
    const r = riscoValidadeItem(it, hoje);
    if(r && (!pior || ordem[r] > ordem[pior])) pior = r;
  });
  return pior;
}
// marca position.alerta = true quando a posição tem item vencido, crítico
// (vence em até 7 dias) ou danificado — usado no contador do topo e no
// ícone de alerta da lista de busca.
function annotatePositions(positions){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  positions.forEach(p=>{
    const risco = riscoValidadePosicao(p.itens, hoje);
    const danificado = p.itens.some(it=>isTruthy(it[8]));
    p.alerta = risco === "vencido" || risco === "critico" || danificado;
  });
  return positions;
}

// Mesma regra de combinação de filtro que a cena 3D usa (entryMatchesMode lá
// dentro do efeito Three.js) — reaproveitada aqui, em JS puro, pra Visão 2D
// (e qualquer outra lista fora do canvas) destacar/esconder exatamente igual.
function posicaoCombinaModo(p, mode, risco){
  if(!mode || mode.type==="none" || mode.type==="busca") return true;
  if(mode.type==="vazio") return p.itens.length===0;
  if(p.itens.length===0) return false; // vencido/danificado/risco/cliente/família exigem item
  if(mode.type==="vencido")    return risco==="vencido";
  if(mode.type==="danificado") return p.itens.some(it=>isTruthy(it[8]));
  if(mode.type==="risco")      return !!risco;
  if(mode.type==="cliente")    return p.itens.some(it=>String(it[0]||"").trim()===String(mode.value||"").trim());
  if(mode.type==="familia")    return p.itens.some(it=>String(it[10]||"").trim()===String(mode.value||"").trim());
  return true;
}
// Cor sólida de destaque pro filtro ativo, igual entryHighlightColor() na cena 3D.
function corDestaqueModo(mode){
  if(!mode) return null;
  if(mode.type==="vencido" || mode.type==="danificado" || mode.type==="risco") return "#e63946";
  if(mode.type==="cliente") return "#ffd400";
  if(mode.type==="familia") return corFamilia(mode.value);
  return null;
}

/* =========================================================================
   IMPORTAÇÃO DE PLANILHA DO ERP (.xls / .xlsx / .csv)
   O usuário seleciona o arquivo que sempre sobe pra atualizar o saldo; aqui a
   gente lê ele no próprio navegador (via SheetJS) e converte cada linha
   (item/lote) para o formato que o app já usa: um array de POSIÇÕES, cada
   uma com sua lista de itens.
   ========================================================================= */
// aceita "Sim"/"S" (com ou sem acento/maiúscula) como verdadeiro
function isSimOuS(v){
  return String(v||"").trim().toLowerCase().startsWith("s");
}
// converte célula de data (Date do SheetJS ou texto) para "AAAA-MM-DD".
// A planilha do ERP exporta datas no padrão americano MM/DD/AAAA (confirmado
// pelos exemplos com dia > 12, ex.: 10/31/2026), por isso a leitura de texto
// assume MM/DD/AAAA. Se um dia vier trocado, é só avisar que eu ajusto.
function erpDateToIso(val){
  if(val instanceof Date && !isNaN(val)){
    const y=val.getFullYear(), m=String(val.getMonth()+1).padStart(2,"0"), d=String(val.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+d;
  }
  const s = String(val||"").trim();
  if(!s) return "";
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); // MM/DD/AAAA
  if(m) return m[3]+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // já em ISO
  if(m) return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  return "";
}
// extrai o primeiro número de um texto (ex.: " '11" -> 11)
function parseIntLoose(v){
  const m = String(v||"").match(/\d+/);
  return m ? parseInt(m[0],10) : 0;
}
// junta as linhas (uma por item/lote) em posições, no formato { pos, rua,
// col, niv, giro, itens:[[...]] } que o resto do app já espera
function convertErpRowsToPositions(rows){
  const byPos = new Map();
  rows.forEach(row=>{
    const posId = String(row["id_posicao"]||"").trim();
    if(!posId) return;
    let rua = String(row["pratel_en"]||"").trim();
    let col = parseIntLoose(row["coluna_en"]);
    let niv = parseIntLoose(row["altura_en"]);
    if(!rua || !col || !niv){
      const parts = posId.split(".");
      if(parts.length>=3){
        rua = rua || parts[0];
        col = col || parseInt(parts[1],10) || 0;
        niv = niv || parseInt(parts[2],10) || 0;
      }
    }
    const diasSemMov = parseFloat(row["Dias sem Mov Fiscal"]) || 0;
    const giroScore = Math.min(1, diasSemMov/365); // >=365 dias parado = giro 1 (bem lento)
    const item = [
      String(row["cod_cli"]||"").trim(),         // cliente
      String(row["Codigo"]||"").trim(),           // codigo
      String(row["descricao"]||"").trim(),        // desc
      parseFloat(row["Qtde"]) || 0,                // qtde
      String(row["cod_lot_fm"]||"").trim(),        // lote
      erpDateToIso(row["dat_val_fm"]),             // validade (ISO)
      false,                                        // vencido: calculado pelo app a partir da validade
      isSimOuS(row["Perecivel"]),                  // perecivel
      isSimOuS(row["Danificado"]),                 // danificado
      giroScore,                                    // giroScore
      String(row["Familia"]||"").trim(),            // familia (BRINDE, VESTUARIO, DISPLAY, PRODUTO, GRÁFICO...)
      parseFloat(row["VALOR UNITARIO MEDIO"]) || 0, // valorUnitario (R$)
      parseFloat(row["Reservado"]) || 0,            // reservado (qtd reservada do lote, 0 = nenhuma)
      erpDateToIso(row["DATA ULTIMA ENTRADA"]),     // ultimaEntrada (ISO)
      erpDateToIso(row["DATA ULTIMA SAIDA"]),       // ultimaSaida (ISO, pode ser vazio — nem todo item já saiu)
      String(row["CodFornecedor"]||"").trim(),      // fornecedor
      String(row["STATUS"]||"").trim()              // diasParadoFaixa (faixa de dias sem mov.: "ABAIXO DE 30 DIAS" etc.)
    ];
    if(!byPos.has(posId)) byPos.set(posId, { pos:posId, rua, col, niv, itens:[], _giroSum:0, _giroCount:0 });
    const p = byPos.get(posId);
    p.itens.push(item);
    p._giroSum += giroScore;
    p._giroCount++;
  });
  return Array.from(byPos.values()).map(p=>({
    pos:p.pos, rua:p.rua, col:p.col, niv:p.niv,
    giro: p._giroCount ? p._giroSum/p._giroCount : 0,
    itens: p.itens
  }));
}
// lê o arquivo selecionado (.xls/.xlsx/.csv) e devolve o array de posições pronto
async function readErpFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:"array", cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:"", raw:true });
  const positions = convertErpRowsToPositions(rows);
  if(!positions.length) throw new Error("Nenhuma posição válida encontrada nessa planilha.");
  return positions;
}

/* =========================================================================
   CLASSIFICAÇÃO: posições reais do galpão x posições fictícias/irregulares
   Regra: uma rua é considerada fictícia quando (a) o nome não é composto só
   por letras (ex.: "17") ou (b) sua maior coluna é muito menor que a mediana
   das demais ruas (ex.: "PI", que só vai até a coluna 12 enquanto o padrão
   do galpão vai até ~73/74). Além disso, posições isoladas cuja coluna foge
   muito do padrão dentro de uma rua real (ex.: "T.878.1") são destacadas
   como "extravio" e também vão para o bloco fictício.
   ========================================================================= */
function classifyEstoque(data){
  const byRua = new Map();
  data.forEach(pos=>{
    if(!byRua.has(pos.rua)) byRua.set(pos.rua, []);
    byRua.get(pos.rua).push(pos);
  });
  const ruaNames = Array.from(byRua.keys());
  const maxCols  = ruaNames.map(r => Math.max(...byRua.get(r).map(p=>p.col)));
  const sortedMaxCols = [...maxCols].sort((a,b)=>a-b);
  const median = sortedMaxCols[Math.floor(sortedMaxCols.length/2)] || 1;
  const smallRuaThreshold   = median * 0.5;
  const outlierColThreshold = median * 2.5;

  // Em vez de assumir que "rua real = só letras" (isso varia de galpão pra
  // galpão — aqui é o CONTRÁRIO: ruas reais são numéricas 01-32, e as
  // fictícias/irregulares usam letras: FR, SAC, HNK, AF...), detectamos
  // dinamicamente qual dos dois padrões de nome concentra a maior parte das
  // POSIÇÕES reais do estoque, e tratamos esse como o padrão "real".
  const isNumeric = name => /^\d+$/.test(name);
  let posicoesNumericas = 0, posicoesAlfa = 0;
  ruaNames.forEach(name=>{
    const n = byRua.get(name).length;
    if(isNumeric(name)) posicoesNumericas += n; else posicoesAlfa += n;
  });
  const padraoRealENumerico = posicoesNumericas >= posicoesAlfa;

  const realNames = [], ficticiaNames = [];
  ruaNames.forEach(name=>{
    const maxCol = Math.max(...byRua.get(name).map(p=>p.col));
    const seguePadrao = isNumeric(name) === padraoRealENumerico;
    if(!seguePadrao || maxCol < smallRuaThreshold) ficticiaNames.push(name);
    else realNames.push(name);
  });
  const ficticiaSet = new Set(ficticiaNames);

  const realPositions = [], ficticiaPositions = [], outlierPositions = [];
  data.forEach(pos=>{
    if(ficticiaSet.has(pos.rua)) ficticiaPositions.push(pos);
    else if(pos.col > outlierColThreshold) outlierPositions.push(pos);
    else realPositions.push(pos);
  });

  // reindexa as posições "extraviadas" numa rua sintética própria, dentro
  // de uma faixa de coluna sensata, preservando a posição original para exibição
  const extraviadas = outlierPositions.map((p,i)=>({
    ...p, origPos: p.pos, rua: "EXTRAVIO", col: i+1, niv: 1
  }));

  const sortRuaNames = arr => [...arr].sort((a,b)=> a.length - b.length || (a<b?-1:a>b?1:0));

  return {
    realRuas: sortRuaNames(realNames),
    ficticiaRuas: sortRuaNames(ficticiaNames).concat(extraviadas.length ? ["EXTRAVIO"] : []),
    realPositions,
    ficticiaPositions: ficticiaPositions.concat(extraviadas)
  };
}

/* =========================================================================
   MONTAGEM DOS CORREDORES (par esquerda/direita)
   A primeira rua da sequência ocupa somente o lado direito do primeiro
   corredor (ex.: rua "A" só tem lado direito), depois seguem pares normais.
   ========================================================================= */
function buildCorridors(orderedRuas){
  const corridors = [];
  if(!orderedRuas.length) return corridors;
  corridors.push({ left: null, right: orderedRuas[0] });
  for(let i=1; i<orderedRuas.length; i+=2){
    corridors.push({ left: orderedRuas[i], right: orderedRuas[i+1] !== undefined ? orderedRuas[i+1] : null });
  }
  return corridors;
}

function buildBlockLayout(orderedRuas, positions, originX){
  const corridors = buildCorridors(orderedRuas);
  const maxColByRua = {}, maxLevelByRua = {};
  positions.forEach(p=>{
    maxColByRua[p.rua]   = Math.max(maxColByRua[p.rua]   || 0, p.col);
    maxLevelByRua[p.rua] = Math.max(maxLevelByRua[p.rua] || 0, p.niv);
  });
  const corridorSpanX = AISLE_WIDTH + RACK_DEPTH*2 + CORRIDOR_GAP;
  const ruaX = {};
  const ruaFaceDir = {}; // +1 = corredor fica do lado +X da rua · -1 = do lado -X
  corridors.forEach((c,i)=>{
    const centerX = originX + i*corridorSpanX;
    if(c.left)  { ruaX[c.left]  = centerX - AISLE_WIDTH/2 - RACK_DEPTH/2; ruaFaceDir[c.left]  = +1; }
    if(c.right) { ruaX[c.right] = centerX + AISLE_WIDTH/2 + RACK_DEPTH/2; ruaFaceDir[c.right] = -1; }
  });
  const maxColOverall = Math.max(1, ...orderedRuas.map(r=>maxColByRua[r]||0));
  const totalWidth = corridors.length * corridorSpanX;
  const totalDepth = maxColOverall * COL_SPACING;
  return { ruas: orderedRuas, corridors, ruaX, ruaFaceDir, maxColByRua, maxLevelByRua,
           corridorSpanX, totalWidth, totalDepth, maxColOverall, originX, positions };
}

// Posições vazias: para cada rua do bloco, gera as combinações col x nível
// que aparecem na grade mas não têm registro de item no estoque.json.
// (aproximação: assume grade cheia col x nível por rua, já que o arquivo só lista posições ocupadas)
function computeEmptySlots(layout){
  // usa (rua,col,niv) em vez da string "pos" para não ser enganado por
  // pequenas inconsistências de formatação no arquivo de origem (ex.: "PI.08.1" vs "PI.08.01")
  const occupied = new Set(layout.positions.map(p=>p.rua+"|"+p.col+"|"+p.niv));
  const empties = [];
  layout.ruas.forEach(rua=>{
    const maxCol = layout.maxColByRua[rua] || 0;
    const maxNiv = layout.maxLevelByRua[rua] || 0;
    for(let col=1; col<=maxCol; col++){
      for(let niv=1; niv<=maxNiv; niv++){
        if(!occupied.has(rua+"|"+col+"|"+niv)){
          const pos = rua + "." + String(col).padStart(2,"0") + "." + niv;
          empties.push({ pos, rua, col, niv });
        }
      }
    }
  });
  return empties;
}

const PALLET_HEIGHT = 0.14;
// quantos "níveis de empilhamento" mostrar, de acordo com quantos lotes/SKUs
// existem na posição — é uma representação GENÉRICA (não é a caixa real),
// só pra dar volume visual: pouco material = pouca caixa, muito material = pilha cheia.
function tierForItemCount(n){
  if(n<=0) return 0;
  if(n===1) return 1;
  if(n<=3) return 2;
  if(n<=6) return 3;
  return 4;
}
function tierTemplate(tier){
  if(tier<=0) return [];
  if(tier===1){
    const sy=LEVEL_HEIGHT*0.42;
    return [ {dx:0,dz:0,y0:sy/2, sx:RACK_DEPTH*0.5, sy, sz:COL_SPACING*0.5} ];
  }
  if(tier===2){
    const sy=LEVEL_HEIGHT*0.38;
    return [
      {dx:-RACK_DEPTH*0.19, dz:0, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.62},
      {dx: RACK_DEPTH*0.19, dz:0, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.62}
    ];
  }
  if(tier===3){
    const sy=LEVEL_HEIGHT*0.34;
    const out=[];
    [-1,1].forEach(sx=>[-1,1].forEach(sz=>{
      out.push({dx:sx*RACK_DEPTH*0.19, dz:sz*COL_SPACING*0.19, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.34});
    }));
    return out;
  }
  // tier 4: base 2x2 + 2 caixas no topo (pilha "cheia")
  const sy=LEVEL_HEIGHT*0.32;
  const out=[];
  [-1,1].forEach(sx=>[-1,1].forEach(sz=>{
    out.push({dx:sx*RACK_DEPTH*0.19, dz:sz*COL_SPACING*0.19, y0:sy/2, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.34});
  }));
  [-1,1].forEach(sx=>{
    out.push({dx:sx*RACK_DEPTH*0.19, dz:0, y0:sy*1.5, sx:RACK_DEPTH*0.34, sy, sz:COL_SPACING*0.6});
  });
  return out;
}
function tierStackHeight(tier){
  const slots = tierTemplate(tier);
  return slots.reduce((m,s)=>Math.max(m, s.y0+s.sy/2), 0.15);
}

/* =========================================================================
   VISÃO 2D — grade rua x coluna com status agregado por posição, como
   alternativa de leitura rápida à cena 3D (sobreposta ao canvas, mesma
   página "Visualização 3D").
   ========================================================================= */
function Visao2DGrid({ grid2D, onSelectPos, onJumpRua, isMobile, mode, modeLabel, filtroNivel }){
  if(!grid2D) return null;
  const corDestaque = corDestaqueModo(mode);
  const filtrando = !!mode && mode.type!=="none" && mode.type!=="busca";
  const maxColGeral = grid2D.reduce((m,r)=>Math.max(m, r.colunas.length), 0);
  const tamanhoCel = isMobile ? 12 : 15;
  return h("div", { style:{ position:"absolute", inset:0, zIndex:11,
      background: PAL.paper,
      overflow:"auto", padding: isMobile ? "10px" : "16px 20px" } },

    // --- cabeçalho: contexto do que está sendo mostrado (faixa de rua, nível, filtro ativo) ---
    h("div", { style:{ display:"flex", flexWrap:"wrap", alignItems:"center", gap:10, marginBottom:14,
        paddingBottom:10, borderBottom:"1px solid " + PAL.line } },
      h("div", { style:{ fontSize:13, fontWeight:700, color:PAL.ink } }, "🗺️ Visão 2D — planta por rua/coluna"),
      h("div", { style:{ fontSize:11, color:PAL.mute } },
        grid2D.length, " rua(s)", filtroNivel!=null ? " · nível " + filtroNivel : " · todos os níveis"),
      modeLabel && h("div", { style:{ marginLeft: isMobile?0:"auto", display:"flex", alignItems:"center", gap:6,
          background: corDestaque ? corDestaque+"1f" : "#E8F0FF",
          border:"1px solid " + (corDestaque || PAL.azure), borderRadius:6, padding:"4px 10px" } },
        h("span", { style:{ width:9, height:9, borderRadius:"50%", background: corDestaque || PAL.azure, flex:"0 0 auto" } }),
        h("span", { style:{ fontSize:11, color:PAL.ink, fontWeight:600 } }, modeLabel))
    ),

    filtrando && h("div", { style:{ fontSize:10.5, color:PAL.mute, marginBottom:8 } },
      "As células esmaecidas abaixo não combinam com o filtro ativo · as destacadas combinam."),

    grid2D.length===0 && h("div", { style:{ color:PAL.mute, fontSize:13 } }, "Nenhuma rua na faixa selecionada."),

    // --- réguas de coluna (a cada 5) pra dar referência de onde cada posição fica ---
    maxColGeral>0 && h("div", { style:{ display:"flex", alignItems:"center", gap:6, marginBottom:4 } },
      h("div", { style:{ width: isMobile?44:56, flex:"0 0 auto" } }),
      h("div", { style:{ display:"flex", gap:2 } },
        Array.from({ length: maxColGeral }).map((_,i)=> h("div", { key:i,
          style:{ width: tamanhoCel, flex:"0 0 auto", fontSize:8.5, color:PAL.mute, textAlign:"center" } },
          (i+1)%5===0 ? String(i+1) : "")))
    ),

    h("div", { style:{ display:"inline-block", minWidth:"100%" } },
      grid2D.map(({ rua, colunas })=> h("div", { key:rua, style:{ display:"flex", alignItems:"center", gap:6, marginBottom:3 } },
        h("button", { onClick:()=>onJumpRua && onJumpRua(rua),
          title:"Ir pra rua " + rua + " na Visão 3D",
          style:{ width: isMobile?44:56, flex:"0 0 auto", fontSize:11, fontWeight:700, color:PAL.royal,
          fontFamily:"'JetBrains Mono', monospace", background:"none", border:"none", textAlign:"left",
          cursor:"pointer", padding:0 } }, "RUA " + rua),
        h("div", { style:{ display:"flex", gap:2 } },
          colunas.map((c,i)=> {
            const combina = !filtrando || c.match;
            return h("div", {
              key:i,

/* =========================================================================
   PÁGINA: PRODUTOS — agrega por código (SKU), mostrando posições, qtd
   total e valor total (valorUnitario x qtde, quando a planilha trouxer).
   ========================================================================= */
function PaginaProdutos({ data, isMobile }){
  const [busca, setBusca] = useState("");
  const [paginaProd, setPaginaProd] = useState(0);
  const porPaginaProd = 60;

  const produtosTodos = useMemo(()=>{
    const map = new Map();
    (data||[]).forEach(p=>{
      p.itens.forEach(it=>{
        const obj = itemToObj(it);
        const cod = obj.codigo || "(sem código)";
        if(!map.has(cod)) map.set(cod, { codigo:cod, desc:obj.desc, familia:obj.familia, qtde:0, valor:0, posicoes:new Set() });
        const r = map.get(cod);
        r.qtde += Number(obj.qtde)||0;
        r.valor += (Number(obj.qtde)||0) * (Number(obj.valorUnitario)||0);
        r.posicoes.add(p.pos);
      });
    });
    return Array.from(map.values()).sort((a,b)=>b.qtde-a.qtde);
  }, [data]);

  const produtosFiltrados = useMemo(()=>{
    const termo = busca.trim().toLowerCase();
    if(!termo) return produtosTodos;
    return produtosTodos.filter(pr =>
      (pr.codigo||"").toLowerCase().includes(termo) ||
      (pr.desc||"").toLowerCase().includes(termo) ||
      (pr.familia||"").toLowerCase().includes(termo));
  }, [produtosTodos, busca]);

  const totalPaginasProd = Math.max(1, Math.ceil(produtosFiltrados.length/porPaginaProd));
  const paginaProdAtual = Math.min(paginaProd, totalPaginasProd-1);
  const produtos = produtosFiltrados.slice(paginaProdAtual*porPaginaProd, paginaProdAtual*porPaginaProd+porPaginaProd);

  return h("div", { style:{ flex:"1 1 auto", overflow:"auto", padding: isMobile?"14px":"20px", background:PAL.paper } },
    h("h2", { style:{ margin:"0 0 4px", fontSize:16,
      background:"linear-gradient(90deg, " + PAL.navy + ", " + PAL.royal + ")", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" } }, "Produtos armazenados"),
    h("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8, marginBottom:14 } },
      h("p", { style:{ margin:0, fontSize:12, color:PAL.mute } },
        produtosFiltrados.length.toLocaleString("pt-BR"), " SKU(s)",
        busca ? " encontrados · " + produtosTodos.length.toLocaleString("pt-BR") + " no total" : " ativos",
        " · página ", paginaProdAtual+1, "/", totalPaginasProd),
      h("div", { style:{ display:"flex", gap:6, alignItems:"center" } },
        h("input", { type:"text", placeholder:"Buscar por código, descrição ou família...", value:busca,
          onChange:(e)=>{ setBusca(e.target.value); setPaginaProd(0); },
          style:{ padding:"6px 10px", borderRadius:6, border:"1px solid " + PAL.line,
            background:"#fff", color:PAL.ink, fontSize:12, outline:"none", width: isMobile?140:220 } }),
        h("button", { onClick:()=>setPaginaProd(p=>Math.max(0,p-1)), disabled:paginaProdAtual===0,
          style:{ padding:"5px 10px", borderRadius:6, border:"1px solid " + PAL.line, background:"#fff",
            color:PAL.ink, fontSize:12, cursor: paginaProdAtual===0?"default":"pointer", opacity: paginaProdAtual===0?0.5:1 } }, "←"),
        h("button", { onClick:()=>setPaginaProd(p=>Math.min(totalPaginasProd-1,p+1)), disabled:paginaProdAtual>=totalPaginasProd-1,
          style:{ padding:"5px 10px", borderRadius:6, border:"1px solid " + PAL.line, background:"#fff",
            color:PAL.ink, fontSize:12, cursor: paginaProdAtual>=totalPaginasProd-1?"default":"pointer", opacity: paginaProdAtual>=totalPaginasProd-1?0.5:1 } }, "→")
      )
    ),
    h("div", { style:{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill, minmax(260px, 1fr))", gap:12 } },
      produtos.map(pr => h("div", { key:pr.codigo, style:{ position:"relative", overflow:"hidden", background: PAL.cardGrad,
          border:"1px solid " + PAL.line, borderRadius:10, padding:"14px 16px", boxShadow:PAL.cardShadow } },
        h("div", { style:{ position:"absolute", left:0, right:0, top:0, height:3,
          background:"linear-gradient(90deg, " + PAL.azure + ", #79B0FF 55%, transparent)" } }),
        h("div", { style:{ fontWeight:700, color:PAL.ink, fontSize:13, marginBottom:2, lineHeight:1.3 } }, pr.desc || pr.codigo),
        h("div", { style:{ fontSize:11, color:PAL.mute, fontFamily:"'JetBrains Mono', monospace", marginBottom:10 } },
          pr.codigo, pr.familia ? " · " + pr.familia : ""),
        h("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:11.5, padding:"3px 0", borderTop:"1px solid " + PAL.line } },
          h("span", { style:{ color:PAL.mute } }, "Posições"), h("strong", { style:{ color:PAL.ink } }, pr.posicoes.size.toLocaleString("pt-BR"))),
        h("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:11.5, padding:"3px 0" } },
          h("span", { style:{ color:PAL.mute } }, "Quantidade"), h("strong", { style:{ color:PAL.ink } }, pr.qtde.toLocaleString("pt-BR"))),
        pr.valor>0 && h("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:11.5, padding:"3px 0" } },
          h("span", { style:{ color:PAL.mute } }, "Valor total"),
          h("strong", { style:{ color:PAL.ok } }, "R$ " + pr.valor.toLocaleString("pt-BR", { maximumFractionDigits:0 })))
      ))
    )
  );
}

/* =========================================================================

  return h("div", { style:{ flex:"1 1 auto", overflow:"auto", padding: isMobile?"14px":"20px", background:PAL.paper } },
    h("div", { style:{ display:"flex", justifyContent:"space-between", alignItems:"baseline", flexWrap:"wrap", gap:8, marginBottom:10 } },
      h("div", null,
        h("h2", { style:{ margin:"0 0 4px", fontSize:16,
          background:"linear-gradient(90deg, " + PAL.navy + ", " + PAL.royal + ")", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" } }, "Endereços de estoque"),
        h("p", { style:{ margin:0, fontSize:12, color:PAL.mute } }, linhas.length.toLocaleString("pt-BR"), " endereços · página ", paginaAtual+1, "/", totalPaginas)),
      h("div", { style:{ display:"flex", gap:6 } },
        h("button", { onClick:()=>setPagina(p=>Math.max(0,p-1)), disabled:paginaAtual===0,
          style:{ padding:"5px 10px", borderRadius:6, border:"1px solid " + PAL.line, background:"#fff",
            color:PAL.ink, fontSize:12, cursor: paginaAtual===0?"default":"pointer", opacity: paginaAtual===0?0.5:1 } }, "← Anterior"),
        h("button", { onClick:()=>setPagina(p=>Math.min(totalPaginas-1,p+1)), disabled:paginaAtual>=totalPaginas-1,
          style:{ padding:"5px 10px", borderRadius:6, border:"1px solid " + PAL.line, background:"#fff",
            color:PAL.ink, fontSize:12, cursor: paginaAtual>=totalPaginas-1?"default":"pointer", opacity: paginaAtual>=totalPaginas-1?0.5:1 } }, "Próximo →")
      )
    ),
    h("div", { style:{ overflowX:"auto", border:"1px solid " + PAL.line, borderRadius:8, background:"#fff", boxShadow:PAL.cardShadow } },
      h("table", { style:{ width:"100%", borderCollapse:"collapse", fontSize:12 } },
        h("thead", null, h("tr", { style:{ background:"linear-gradient(180deg,#F2F6FF,#E3ECFC)", color:PAL.ink2, textAlign:"left" } },
          ["Endereço","Rua","Col","Nv","Status","Produto principal","Itens"].map(c=>
            h("th", { key:c, style:{ padding:"8px 10px", fontWeight:600, fontSize:11, textTransform:"uppercase" } }, c)))),
        h("tbody", null, visiveis.map(p=>{
          const ocupado = p.itens.length>0;
          const principal = ocupado ? itemToObj(p.itens[0]).desc : "—";
          return h("tr", { key:p.pos, onClick:()=>onSelectPos(p.pos), style:{ borderTop:"1px solid " + PAL.line, cursor:"pointer" } },
            h("td", { style:{ padding:"7px 10px", fontFamily:"'JetBrains Mono', monospace", color:PAL.royal, fontWeight:600 } }, p.pos),
            h("td", { style:{ padding:"7px 10px", color:PAL.ink } }, p.rua),
            h("td", { style:{ padding:"7px 10px", color:PAL.ink } }, p.col),
            h("td", { style:{ padding:"7px 10px", color:PAL.ink } }, p.niv),
            h("td", { style:{ padding:"7px 10px" } }, h("span", { style:{ fontSize:10, fontWeight:700, padding:"2px 7px",
              borderRadius:4, background: ocupado ? PAL.okBg : PAL.semBg,
              color: ocupado ? "#0A5E55" : PAL.mute } }, ocupado ? "OCUPADO" : "VAZIO")),
            h("td", { style:{ padding:"7px 10px", color:PAL.mute, maxWidth:260, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" } }, principal),
            h("td", { style:{ padding:"7px 10px", color:PAL.ink } }, p.itens.length)
          );
        }))
      )

/* =========================================================================
   PÁGINA: RELATÓRIOS — agregações reais sobre o snapshot atual dos dados.
   Não existe histórico (o app não guarda posições anteriores), então não
   há "evolução no tempo" aqui — só cortes do estado atual, honestamente.
   ========================================================================= */
function BarraHorizontal({ label, valor, max, cor }){
  const pct = max>0 ? Math.max(2, Math.round(valor/max*100)) : 0;
  return h("div", { style:{ marginBottom:9 } },
    h("div", { style:{ display:"flex", justifyContent:"space-between", fontSize:11.5, marginBottom:3 } },
      h("span", { style:{ color:PAL.mute } }, label), h("strong", { style:{ color:PAL.ink } }, valor.toLocaleString("pt-BR"))),
    h("div", { style:{ height:7, borderRadius:4, background:PAL.semBg, overflow:"hidden" } },
      h("div", { style:{ width:pct+"%", height:"100%", background:cor } }))
  );
}
function PaginaRelatorios({ data, kpis, isMobile }){
  const porFamilia = useMemo(()=>{
    const map = new Map();
    (data||[]).forEach(p=>p.itens.forEach(it=>{
      const fam = itemToObj(it).familia || "(sem família)";
      map.set(fam, (map.get(fam)||0)+1);
    }));
    return Array.from(map.entries()).map(([k,v])=>({ label:k, valor:v })).sort((a,b)=>b.valor-a.valor);
  }, [data]);

  const topProdutos = useMemo(()=>{
    const map = new Map();
    (data||[]).forEach(p=>p.itens.forEach(it=>{
      const obj = itemToObj(it);
      const key = obj.codigo || obj.desc;
      if(!map.has(key)) map.set(key, { label: obj.desc || obj.codigo, valor:0 });
      map.get(key).valor += Number(obj.qtde)||0;
    }));
    return Array.from(map.values()).sort((a,b)=>b.valor-a.valor).slice(0,10);
  }, [data]);

  const maxFamilia = porFamilia.length ? porFamilia[0].valor : 0;
  const maxProduto = topProdutos.length ? topProdutos[0].valor : 0;

  const cardStyle = { position:"relative", overflow:"hidden", background: PAL.cardGrad, border:"1px solid " + PAL.line,
    borderRadius:10, padding:"16px 18px", boxShadow:PAL.cardShadow };
  const cardBar = h("div", { style:{ position:"absolute", left:0, right:0, top:0, height:3,
    background:"linear-gradient(90deg, " + PAL.azure + ", #79B0FF 55%, transparent)" } });

  return h("div", { style:{ flex:"1 1 auto", overflow:"auto", padding: isMobile?"14px":"20px", background:PAL.paper } },
    h("h2", { style:{ margin:"0 0 4px", fontSize:16,
      background:"linear-gradient(90deg, " + PAL.navy + ", " + PAL.royal + ")", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" } }, "Relatórios"),
    h("p", { style:{ margin:"0 0 16px", fontSize:11.5, color:PAL.mute } },
      "Cortes sobre o snapshot atual do estoque — o app não guarda histórico entre importações, então não há gráfico de evolução no tempo."),

    h("div", { style:{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap:16 } },

      kpis && h("div", { style:cardStyle }, cardBar,
        h("div", { style:{ fontWeight:700, marginBottom:12, color:PAL.ink, fontSize:13 } }, "Distribuição por status"),
        BarraHorizontal({ label:"Ocupados", valor:kpis.ocupadas, max:kpis.capacidade, cor:STATUS2D_CORES.ocupado }),
        BarraHorizontal({ label:"Vazios", valor:kpis.vazias, max:kpis.capacidade, cor:STATUS2D_CORES.vazio }),
        BarraHorizontal({ label:"Vencidos", valor:kpis.vencidas, max:kpis.capacidade, cor:STATUS2D_CORES.vencido }),
        BarraHorizontal({ label:"A vencer ≤15d", valor:kpis.aVencer, max:kpis.capacidade, cor:STATUS2D_CORES.aVencer }),
        BarraHorizontal({ label:"Danificados", valor:kpis.danificadas, max:kpis.capacidade, cor:STATUS2D_CORES.danificado })
      ),

      h("div", { style:cardStyle }, cardBar,
        h("div", { style:{ fontWeight:700, marginBottom:12, color:PAL.ink, fontSize:13 } }, "Itens por família"),
        porFamilia.slice(0,10).map(f => h(React.Fragment, { key:f.label },
          BarraHorizontal({ label:f.label, valor:f.valor, max:maxFamilia, cor:PAL.royal })))
      ),

      h("div", { style:{ ...cardStyle, gridColumn: isMobile ? "auto" : "1 / span 2" } }, cardBar,
        h("div", { style:{ fontWeight:700, marginBottom:12, color:PAL.ink, fontSize:13 } }, "Produtos mais armazenados (por quantidade)"),
        topProdutos.map(p => h(React.Fragment, { key:p.label },
          BarraHorizontal({ label:p.label, valor:p.valor, max:maxProduto, cor:PAL.v30 })))
      )
    )
  );
}

const PaginaFn = { produtos: PaginaProdutos, enderecos: PaginaEnderecos, relatorios: PaginaRelatorios };

function Armazem3D(){
  const mountRef = useRef(null);

  const [data, setData] = useState(null);
