  const viewModeRef = useRef(viewMode);
  viewModeRef.current = viewMode;
  const [walkInputMode, setWalkInputMode] = useState("mouse"); // "mouse" | "teclado" — só quando viewMode="walk"

  // modo único de visualização: busca livre, cliente, vencidos, danificados ou vazios
  const [mode, setMode] = useState({ type:"none" });
  const [searchText, setSearchText] = useState("");
  // estado da importação manual da planilha do ERP (.xls/.xlsx/.csv)
  const [importStatus, setImportStatus] = useState(null); // { state:"loading"|"success"|"error", ... }
  // painel com dados reais do prédio (fonte: projeto de Vigilância Sanitária PMB 059627/2026)
  const [infoOpen, setInfoOpen] = useState(false);

  // --- navegação do app (páginas, tipo o menu lateral de referência) ---
  const [page, setPage] = useState("3d"); // "3d" | "produtos" | "enderecos" | "relatorios"
  // --- Visão 2D (grade rua x coluna) sobreposta à Visão 3D, mesma página ---
  const [visao2D, setVisao2D] = useState(false);
  // --- painel de filtros avançados (faixa de rua, nível) ---
  const [filtrosAvOpen, setFiltrosAvOpen] = useState(false);
  const [filtroRuaDe, setFiltroRuaDe] = useState("");
  const [filtroRuaAte, setFiltroRuaAte] = useState("");
  const [filtroNivel, setFiltroNivel] = useState(null); // null = todos

  // --- responsivo: detecta tela pequena (celular) para adaptar o layout ---
  const [isMobile, setIsMobile] = useState(()=> typeof window !== "undefined" && window.innerWidth <= 760);
  const [filtersOpen, setFiltersOpen] = useState(false); // no celular, filtros ficam recolhidos por padrão
  useEffect(()=>{
    const onResize = ()=> setIsMobile(window.innerWidth <= 760);
    window.addEventListener("resize", onResize);
    return ()=> window.removeEventListener("resize", onResize);
  }, []);

  const handleErpFileSelected = async (file)=>{
    if(!file) return;
    setImportStatus({ state:"loading" });
    try{
      const positions = await readErpFile(file);
      const totalItens = positions.reduce((acc,p)=>acc+p.itens.length, 0);
      setError(null);
      setData(annotatePositions(positions));
      setImportStatus({ state:"success", posCount:positions.length, itemCount:totalItens, at:new Date() });
    }catch(e){
      setImportStatus({ state:"error", message: e.message || String(e) });
    }
  };

  useEffect(()=>{
    let cancelled = false;
    async function load(){
      try{
        const res = await fetch("./estoque.json");
        if(!res.ok) throw new Error("HTTP " + res.status);
        const len = res.headers.get("Content-Length");
        const total = len ? parseInt(len,10) : 0;
        if(!res.body || !total){
          const json = await res.json();
          if(!cancelled) setData(annotatePositions(json));
          return;
        }
        const reader = res.body.getReader();
        let received = 0;
        const chunks = [];
        for(;;){
          const { done, value } = await reader.read();
          if(done) break;
          chunks.push(value);
          received += value.length;
          if(!cancelled) setProgress(Math.min(99, Math.round(received/total*100)));
        }
        const text = await new Blob(chunks).text();
        const json = JSON.parse(text);
        if(!cancelled){ setProgress(100); setData(annotatePositions(json)); }
      }catch(e){
        if(!cancelled) setError(e.message);
      }
    }
    load();
    return ()=>{ cancelled = true; };
  },[]);

  const classified = useMemo(()=> data ? classifyEstoque(data) : null, [data]);

  const mainLayout = useMemo(()=>{
    if(!classified) return null;
    return buildBlockLayout(classified.realRuas, classified.realPositions, 0);
  }, [classified]);

  const ficticiaLayout = useMemo(()=>{
    if(!classified || !classified.ficticiaRuas.length) return null;
    const originX = mainLayout ? mainLayout.totalWidth + BLOCK_GAP : 0;
    return buildBlockLayout(classified.ficticiaRuas, classified.ficticiaPositions, originX);
  }, [classified, mainLayout]);

  const totalItens = useMemo(()=> data ? data.reduce((acc,p)=>acc+p.itens.length,0) : 0, [data]);
  const totalAlertas = useMemo(()=> data ? data.filter(p=>p.alerta).length : 0, [data]);

  // ocupação por rua: posições ocupadas vs capacidade teórica da grade
  // (maxCol x maxNiv observados naquela rua). Ajuda a decidir onde alocar
  // entrada nova sem precisar navegar o mapa 3D procurando vazio.
  const ocupacaoPorRua = useMemo(()=>{
    if(!mainLayout) return {};
    const ocupadas = {};
    mainLayout.positions.forEach(p=>{ ocupadas[p.rua] = (ocupadas[p.rua]||0) + 1; });
    const out = {};
    mainLayout.ruas.forEach(r=>{
      const capacidade = (mainLayout.maxColByRua[r]||0) * (mainLayout.maxLevelByRua[r]||0);
      const ocupado = ocupadas[r] || 0;
      out[r] = { ocupado, capacidade, pct: capacidade>0 ? ocupado/capacidade : 0 };
    });
    return out;
  }, [mainLayout]);

  const ruasLotadas = useMemo(()=> Object.values(ocupacaoPorRua).filter(o=>o.pct>=0.85).length, [ocupacaoPorRua]);

  // KPIs de topo (estilo "barra de indicadores"): capacidade real da grade
  // (maxCol x maxNiv observados por rua), ocupadas, vazias, % ocupação e
  // contagem de posições com item vencido / a vencer / danificado.
  const kpis = useMemo(()=>{
    if(!mainLayout) return null;
    const capacidade = mainLayout.ruas.reduce((acc,r)=>
      acc + (mainLayout.maxColByRua[r]||0) * (mainLayout.maxLevelByRua[r]||0), 0);
    const ocupadas = mainLayout.positions.length;
    const vazias = Math.max(0, capacidade - ocupadas);
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    let vencidas = 0, aVencer = 0, danificadas = 0;
    mainLayout.positions.forEach(p=>{
      const risco = riscoValidadePosicao(p.itens, hoje);
      if(risco === "vencido") vencidas++;
      else if(risco === "critico" || risco === "atencao") aVencer++;
      if(p.itens.some(it=>isTruthy(it[8]))) danificadas++;
    });
    return { capacidade, ocupadas, vazias,
      pctOcupacao: capacidade>0 ? Math.round(ocupadas/capacidade*100) : 0,
      vencidas, aVencer, danificadas };
  }, [mainLayout]);

  // níveis reais existentes no galpão (pra montar os botões de filtro "Nível")
  const niveisDisponiveis = useMemo(()=>{
    if(!mainLayout) return [];
    const set = new Set();
    mainLayout.positions.forEach(p=>set.add(p.niv));
    return Array.from(set).sort((a,b)=>a-b);
  }, [mainLayout]);

  // ruas dentro da faixa "de/até" escolhida no painel de filtros avançados
  // (quando vazio, considera o galpão inteiro) — usado pela Visão 2D e,
  // futuramente, por outras listas que precisem respeitar esse recorte.
  const ruasFiltradas = useMemo(()=>{
    if(!mainLayout) return [];
    if(!filtroRuaDe && !filtroRuaAte) return mainLayout.ruas;
    const idxDe = filtroRuaDe ? mainLayout.ruas.indexOf(filtroRuaDe) : 0;
    const idxAte = filtroRuaAte ? mainLayout.ruas.indexOf(filtroRuaAte) : mainLayout.ruas.length-1;
    const lo = Math.max(0, Math.min(idxDe, idxAte));
    const hi = Math.max(idxDe, idxAte);
    return mainLayout.ruas.slice(lo, hi+1);
  }, [mainLayout, filtroRuaDe, filtroRuaAte]);

  // grade da Visão 2D: status agregado por (rua, coluna), respeitando a
  // faixa de rua e o filtro de nível do painel de filtros avançados.
  // Prioridade de cor quando a coluna tem mais de um status: vencido >
  // danificado > a vencer (≤15d) > ocupado > vazio.
  const grid2D = useMemo(()=>{
    if(!mainLayout || !visao2D) return null;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const ordemStatus = { vencido:5, danificado:4, aVencer:3, ocupado:2, vazio:1 };
    // filtro "ativo de verdade" = os mesmos modos que escondem posição na cena
    // 3D (busca não esconde nada lá, só realça — tratamos igual aqui)
    const filtrando = !!mode && mode.type!=="none" && mode.type!=="busca";
    return ruasFiltradas.map(rua=>{
      const maxCol = mainLayout.maxColByRua[rua] || 0;
      const porColuna = new Map();
      mainLayout.positions.forEach(p=>{
        if(p.rua !== rua) return;
        if(filtroNivel!=null && p.niv !== filtroNivel) return;
        const risco = riscoValidadePosicao(p.itens, hoje);
        const danificado = p.itens.some(it=>isTruthy(it[8]));
        let status = "ocupado";
        if(risco==="vencido") status = "vencido";
        else if(danificado) status = "danificado";
        else if(risco==="critico" || risco==="atencao") status = "aVencer";
        const match = posicaoCombinaModo(p, mode, risco);
        const atual = porColuna.get(p.col);
        // numa coluna com vários níveis, prioriza mostrar o nível que combina
        // com o filtro ativo — senão um "match" pode ficar escondido atrás de
        // outro nível na mesma coluna que não combina
        const melhorQueAtual = !atual || (match && !atual.match) ||
          (match === atual.match && ordemStatus[status] > ordemStatus[atual.status]);
        if(melhorQueAtual) porColuna.set(p.col, { status, pos:p.pos, itens:p.itens.length, match });
      });
      const colunas = [];
      for(let c=1; c<=maxCol; c++){
        colunas.push(porColuna.get(c) || { status:"vazio", pos:null, itens:0, match: !filtrando || mode.type==="vazio" });
      }
      return { rua, colunas };
    });
  }, [mainLayout, ruasFiltradas, filtroNivel, visao2D, mode]);

  const clientes = useMemo(()=>{
    if(!data) return [];
    const set = new Set();
    data.forEach(p=>p.itens.forEach(it=>{ if(it[0]) set.add(it[0]); }));
    return Array.from(set).sort();
  }, [data]);

  // valores reais do campo "Familia" da planilha (BRINDE, VESTUARIO, DISPLAY, PRODUTO, GRÁFICO...)
  const familias = useMemo(()=>{
    if(!data) return [];
    const set = new Set();
    data.forEach(p=>p.itens.forEach(it=>{ if(it[10]) set.add(it[10]); }));
    return Array.from(set).sort();
  }, [data]);

  // lista de resultados quando o modo é "busca"
  const searchResults = useMemo(()=>{
    if(!data || mode.type!=="busca" || !mode.value) return [];
    const q = mode.value.toUpperCase();
    return data.filter(p =>
      p.pos.toUpperCase().includes(q) ||
      p.itens.some(it => (it[0]||"").toUpperCase().includes(q) || (it[1]||"").toUpperCase().includes(q) || (it[2]||"").toUpperCase().includes(q))
    );
  }, [data, mode]);
  const searchResultsShown = useMemo(()=> searchResults.slice(0,40), [searchResults]);

  const modeLabel = mode.type==="cliente" ? "Cliente: " + mode.value + " (destaque amarelo sólido)"
    : mode.type==="familia" ? "Família: " + mode.value + " (destaque sólido)"
    : mode.type==="busca" ? "Busca: \"" + mode.value + "\""
    : mode.type==="vencido" ? "Mostrando apenas posições com item VENCIDO (vermelho sólido)"
    : mode.type==="danificado" ? "Mostrando apenas posições com item DANIFICADO (vermelho sólido)"
    : mode.type==="risco" ? "Vencidos + a vencer em até 15 dias (vermelho sólido)"
    : mode.type==="vazio" ? "Destacando posições vazias (branco sólido)"
    : null;

  // avisa a cena Three.js sempre que o modo de visualização mudar
  useEffect(()=>{
    api.current.applyMode && api.current.applyMode(mode);
  }, [mode]);

  useEffect(()=>{
    api.current.setSelectedByPos && api.current.setSelectedByPos(selected ? selected.pos : null);
  }, [selected]);

  useEffect(()=>{
    api.current.onModeChange && api.current.onModeChange(viewMode);
  }, [viewMode]);

  const focusPosition = useCallback((pos)=>{
    setSelected(pos);
    api.current.focusCamera && api.current.focusCamera(pos);
  }, []);
  // usado pelas páginas Endereços/Produtos e pela Visão 2D, que só têm a
  // string do endereço (ex.: "15.49.1B") — acha o objeto completo em `data`,
  // volta pra página "Visualização 3D" e foca a câmera nele.
  const selectPosByString = useCallback((posStr)=>{
    const obj = data && data.find(p=>p.pos===posStr);
    if(!obj) return;
    setPage("3d");
    setVisao2D(false);
    setSelected(obj);
    api.current.focusCamera && api.current.focusCamera(obj);
  }, [data]);
  const jumpToRua = useCallback((rua)=>{
    api.current.jumpToRua && api.current.jumpToRua(rua);
  }, []);
  const jumpToFicticio = useCallback(()=>{
    api.current.jumpToFicticio && api.current.jumpToFicticio();
  }, []);
  const resetView = useCallback(()=>{
    api.current.resetView && api.current.resetView();
  }, []);
  const viewSuperior = useCallback(()=>{
    api.current.viewSuperior && api.current.viewSuperior();
  }, []);
  const viewFrontal = useCallback(()=>{
    api.current.viewFrontal && api.current.viewFrontal();
  }, []);
  const viewLateral = useCallback(()=>{
    api.current.viewLateral && api.current.viewLateral();
  }, []);

  const toggleMode = useCallback((type)=>{
    setSearchText("");
    setMode(prev => prev.type===type ? { type:"none" } : { type });
  }, []);
  const onSearchChange = useCallback((val)=>{
    setSearchText(val);
    setMode(val.trim() ? { type:"busca", value: val.trim() } : { type:"none" });
  }, []);
  const onClienteChange = useCallback((val)=>{
    setSearchText("");
    setMode(val ? { type:"cliente", value: val } : { type:"none" });
  }, []);
  const onFamiliaChange = useCallback((val)=>{
    setSearchText("");
    setMode(val ? { type:"familia", value: val } : { type:"none" });
  }, []);

  /* =======================================================================
     EFEITO PRINCIPAL: monta a cena Three.js (executa uma vez que os dados
     e os layouts estão prontos)
     ======================================================================= */
  useEffect(()=>{
    if(!data || !mainLayout) return;
    const mount = mountRef.current;
    const width = mount.clientWidth, height = mount.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf2f1ec);
    const totalWidthAll = mainLayout.totalWidth + (ficticiaLayout ? BLOCK_GAP + ficticiaLayout.totalWidth : 0);
    const totalDepthAll = Math.max(mainLayout.totalDepth, ficticiaLayout ? ficticiaLayout.totalDepth : 0);
    scene.fog = new THREE.Fog(0xf2f1ec, 55, 180);

    const centerX = mainLayout.totalWidth/2 - mainLayout.corridorSpanX/2;
    const centerZ = mainLayout.totalDepth/2;
    const maxOrbitRadius = Math.max(totalWidthAll, totalDepthAll) * 1.3 + 30;
    const initialColSort = mainLayout.ruas.map(r=>mainLayout.maxColByRua[r]||0).sort((a,b)=>a-b);
    const typicalDepth = (initialColSort[Math.floor(initialColSort.length/2)] || 1) * COL_SPACING;
    const initialRadius = Math.min(maxOrbitRadius, Math.max(mainLayout.totalWidth, typicalDepth)*0.55 + 14);

    const camera = new THREE.PerspectiveCamera(55, width/height, 0.1, 600);
    const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(centerX+25, 35, centerZ+18);
    scene.add(dirLight);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd6d6, 0.6));

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(totalWidthAll+30, totalDepthAll+30),
      new THREE.MeshStandardMaterial({ color:0xf7f6f2, roughness:0.9 })
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.set(centerX + (ficticiaLayout? (ficticiaLayout.totalWidth+BLOCK_GAP)/2 : 0), 0, centerZ);
    scene.add(floor);

    const postMat = new THREE.MeshStandardMaterial({ color:0x1a4fc4, roughness:0.35, metalness:0.55 });
    const beamMat = new THREE.MeshStandardMaterial({ color:0xf07d1a, roughness:0.35, metalness:0.5 });
    const ficticioPostMat = new THREE.MeshStandardMaterial({ color:0x6a4b8a, roughness:0.4, metalness:0.6 });
    const ficticioBeamMat = new THREE.MeshStandardMaterial({ color:0x8a5a5a, roughness:0.4, metalness:0.5 });

    const aisleHighlightMat = new THREE.MeshStandardMaterial({ color:0xc9be87, roughness:0.85, transparent:true, opacity:0.28 });

    // texturas de rótulo reaproveitadas (mesma string = mesma textura)
    const labelTextureCache = new Map();
    function getLabelTexture(text, opts){
      opts = opts || {};
      const key = text + "|" + (opts.big?1:0) + "|" + (opts.color||"");
      if(labelTextureCache.has(key)) return labelTextureCache.get(key);
      const canvas = document.createElement("canvas");
      canvas.width = opts.big ? 320 : 96;
      canvas.height = opts.big ? 144 : 48;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = opts.color || "#f4efe6";
      ctx.font = "bold " + (opts.big ? 96 : 30) + "px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width/2, canvas.height/2);
      const tex = new THREE.CanvasTexture(canvas);
      labelTextureCache.set(key, tex);
      return tex;
    }
    function addLabelSprite(text, x, y, z, opts){
      opts = opts || {};
      const tex = getLabelTexture(text, opts);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent:true }));
      sprite.position.set(x,y,z);
      sprite.scale.set(opts.big ? 3.6 : (opts.tiny ? 0.32 : 0.85), opts.big ? 1.62 : (opts.tiny ? 0.16 : 0.42), 1);
      scene.add(sprite);
      return sprite;
    }

    // texto "pintado no chão": um plano deitado (não vira de frente pra
    // câmera como o sprite) — pra ler de cima, tipo pintura de piso
    const floorLabelTextureCache = new Map();
    function getFloorLabelTexture(text, color){
      const key = text + "|" + color;
      if(floorLabelTextureCache.has(key)) return floorLabelTextureCache.get(key);
      const canvas = document.createElement("canvas");
      canvas.width = 1024; canvas.height = 192;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = color || "#1c2b3a";
      ctx.font = "bold 108px 'Inter', system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width/2, canvas.height/2);
      const tex = new THREE.CanvasTexture(canvas);
      floorLabelTextureCache.set(key, tex);
      return tex;
    }
    function addFloorLabel(text, x, z, opts){
      opts = opts || {};
      const tex = getFloorLabelTexture(text, opts.color);
      const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false });
      const planeW = opts.width || 6;
      const planeH = planeW * (192/1024);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
      mesh.rotation.x = -Math.PI/2;
      if(opts.rotationZ) mesh.rotation.z = opts.rotationZ;
      mesh.position.set(x, opts.y!=null ? opts.y : 0.025, z);
      scene.add(mesh);
      return mesh;
    }
    // placa PEQUENA e VERTICAL, fixa na borda do palete voltada pro
    // corredor — diferente de sprite (não vira pra câmera: tem orientação
    // fixa, real, "presa" no espaço 3D) e diferente do texto de chão
    // (fica em pé, então dá pra ler andando pelo corredor e olhando de
    // lado — deitado ficava de perfil/invisível nesse ângulo).
    // depthTest desligado pra nunca ser cortada por viga/poste próximos.
    function addPalletDecal(text, x, y, z, faceDir, width){
      const tex = getFloorLabelTexture(text, "#000000");
      const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:false, depthTest:false });
      const w = width || 0.42;
      const h = w * (192/1024);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.rotation.y = faceDir * Math.PI/2; // normal da placa voltada pro corredor
      mesh.renderOrder = 999;
      mesh.position.set(x, y, z);
      mesh.visible = false;
      scene.add(mesh);
      return mesh;
    }

    // ---------------------------------------------------------------------
    // Constrói estrutura física (postes, vigas, rótulos) de um bloco de ruas
    // ---------------------------------------------------------------------
    function buildRackStructure(layout, opts){
      opts = opts || {};
      const pMat = opts.ficticio ? ficticioPostMat : postMat;
      const bMat = opts.ficticio ? ficticioBeamMat : beamMat;

      let postCount = 0, beamCount = 0;
      layout.ruas.forEach(rua=>{
        postCount += ((layout.maxColByRua[rua]||0)+1) * 2;
        beamCount += ((layout.maxLevelByRua[rua]||0)+1) * 2;
      });
      const dummy = new THREE.Object3D();
      const postGeo = new THREE.BoxGeometry(POST_SIZE, 1, POST_SIZE);
      const posts = new THREE.InstancedMesh(postGeo, pMat, Math.max(1, postCount));
      const beamGeo = new THREE.BoxGeometry(BEAM_THICK, BEAM_THICK, 1);
      const beams = new THREE.InstancedMesh(beamGeo, bMat, Math.max(1, beamCount));
      let pi = 0, bi = 0;

      layout.corridors.forEach((c,ci)=>{
        const cx = layout.originX + ci*layout.corridorSpanX;
        const highlight = new THREE.Mesh(new THREE.PlaneGeometry(AISLE_WIDTH*0.94, layout.totalDepth), aisleHighlightMat);
        highlight.rotation.x = -Math.PI/2;
        highlight.position.set(cx, 0.01, layout.totalDepth/2);
        scene.add(highlight);
      });

      layout.ruas.forEach(rua=>{
        const x = layout.ruaX[rua];
        if(x === undefined) return;
        const maxCol = layout.maxColByRua[rua] || 0;
        const maxNiv = layout.maxLevelByRua[rua] || 0;
        const rackTopY = maxNiv*LEVEL_HEIGHT + BASE_LEVEL_Y + 0.3;
        const rackDepthZ = maxCol*COL_SPACING;

        for(let k=0; k<=maxCol; k++){
          const z = k*COL_SPACING;
          [-RACK_DEPTH/2, RACK_DEPTH/2].forEach(offset=>{
            dummy.position.set(x+offset, rackTopY/2, z);
            dummy.scale.set(1, rackTopY, 1);
            dummy.updateMatrix();
            posts.setMatrixAt(pi++, dummy.matrix);
          });
        }
        for(let k=0; k<=maxNiv; k++){
          const y = BASE_LEVEL_Y + k*LEVEL_HEIGHT;
          [-RACK_DEPTH/2, RACK_DEPTH/2].forEach(offset=>{
            dummy.position.set(x+offset, y, rackDepthZ/2);
            dummy.scale.set(1, 1, rackDepthZ+0.3);
            dummy.updateMatrix();
            beams.setMatrixAt(bi++, dummy.matrix);
          });
        }

        // plaquinha da rua, sempre no início da sequência (antes da coluna 1)
        addLabelSprite(rua, x, rackTopY+0.7, -1.4, { big:true, color: opts.ficticio ? "#7a2fb0" : "#1c2b3a" });

        // plaquinhas numeradas ao longo da coluna, no início de cada posição
        if(!opts.ficticio){
          for(let col=1; col<=maxCol; col+=COLUMN_TAG_STEP){
            const zStart = (col-1)*COL_SPACING;
            addLabelSprite(String(col).padStart(2,"0"), x, 0.28, zStart+0.05, { color:"#8a6512" });
          }
        }
      });

      posts.instanceMatrix.needsUpdate = true;
      beams.instanceMatrix.needsUpdate = true;
      scene.add(posts);
      scene.add(beams);
    }

    buildRackStructure(mainLayout, { ficticio:false });
    if(ficticiaLayout){
      buildRackStructure(ficticiaLayout, { ficticio:true });
      // divisória/placa entre o galpão e o bloco fictício
      addLabelSprite("\u26A0 BLOCO FICTÍCIO / IRREGULAR", ficticiaLayout.originX - BLOCK_GAP/2, 4.2, ficticiaLayout.totalDepth/2, { big:true, color:"#d9a4ff" });
    }

    // ---------------------------------------------------------------------
    // Faixa de piso por ZONA (aproximação da planta oficial — ver nota em
    // ZONA_CORES/zonaPorIndiceRua). Só no galpão principal (ruas reais).
    // ---------------------------------------------------------------------
    (function addZonaFloorTint(layout){
      const zonaMat = {};
      Object.keys(ZONA_CORES).forEach(k=>{
        zonaMat[k] = new THREE.MeshBasicMaterial({ color: ZONA_CORES[k], transparent:true, opacity:0.28, depthWrite:false });
      });
      const grupoX = {}; // zona -> lista de X das ruas daquela zona (pra centralizar o texto)
      layout.ruas.forEach((rua, idx)=>{
        const x = layout.ruaX[rua];
        if(x === undefined) return;
        const zona = zonaPorIndiceRua(idx);
        const maxCol = layout.maxColByRua[rua] || 0;
        const depth = maxCol * COL_SPACING;
        if(depth <= 0) return;
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(RACK_DEPTH*1.3, depth), zonaMat[zona]);
        plane.rotation.x = -Math.PI/2;
        plane.position.set(x, 0.015, depth/2);
        scene.add(plane);
        (grupoX[zona] = grupoX[zona]||[]).push(x);
      });
      const ZONA_NOME = { alimentos:"ALIMENTOS", cosmeticos:"COSMÉTICOS", quarentena:"QUARENTENA",
        naoConformes:"NÃO CONFORMES", semInteresse:"PRODUTOS SEM INTERESSE À SAÚDE" };
      const ZONA_COR_CSS = {};
      Object.keys(ZONA_CORES).forEach(k=>{ ZONA_COR_CSS[k] = "#"+ZONA_CORES[k].toString(16).padStart(6,"0"); });
      Object.keys(grupoX).forEach(zona=>{
        const xs = grupoX[zona];
        const xMid = xs.reduce((a,b)=>a+b,0)/xs.length;
        const largura = Math.min(20, Math.max(4, xs.length * 1.1));
        addFloorLabel(ZONA_NOME[zona], xMid, 3.2, { color: ZONA_COR_CSS[zona], width: largura });
      });
    })(mainLayout);

    // ---------------------------------------------------------------------
    // Corredores TRANSVERSAIS ("túneis") cruzando as ruas periodicamente —
    // aproximação visual da faixa de circulação/segurança que a planta
    // mostra cortando as fileiras. Não removo nem realinho nenhuma posição
    // real pra isso (a planilha do WMS é a fonte da verdade da coluna real);
    // é só uma referência visual sobreposta, sem impacto nos dados.
    // ---------------------------------------------------------------------
    (function addTuneisTransversais(layout){
      const totalW = layout.totalWidth;
      const maxDepthCols = Math.max(1, Math.round(layout.totalDepth / COL_SPACING));
      const intervalCols = 18;
      const tunnelMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45, depthWrite:false });
      for(let col = intervalCols; col < maxDepthCols; col += intervalCols){
        const z = col * COL_SPACING;
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(totalW, COL_SPACING*1.3), tunnelMat);
        plane.rotation.x = -Math.PI/2;
        plane.position.set(totalW/2, 0.02, z);
        scene.add(plane);
        addFloorLabel("\u2194 CORREDOR TRANSVERSAL", totalW/2, z, { color:"#33475a", width: Math.min(totalW*0.6, 14) });
      }
    })(mainLayout);

    // ---------------------------------------------------------------------
    // Área operacional de FRENTE do galpão — lida diretamente da planta
    // oficial em alta resolução (Processo PMB 059627/2026, Planta Pavimento
    // Térreo). Ordem real das zonas, do lado das ruas de Alimentos/Cosméticos
    // (produto "relacionado à saúde") até o lado das ruas de Produtos Sem
    // Interesse à Saúde / Alto Valor (material "promocional"), acompanhando
    // a mesma ordem usada em zonaPorIndiceRua. O POSICIONAMENTO X de cada
    // zona/doca é proporcional (não há coordenada exata do DWG), mas os
    // NOMES, a ORDEM e a QUANTIDADE de docas (12) são os reais da planta.
    // ---------------------------------------------------------------------
    (function addFrenteOperacional(layout){
      const totalW = layout.totalWidth;
      const depth = 7.5;
      const zonas = [
        { nome:"SEPARAÇÃO/CONFERÊNCIA (SAÚDE)",        cor:0x5a6b7a, frac:0.07 },
        { nome:"EXPEDIÇÃO (SAÚDE)",                     cor:0x8a4fb0, frac:0.07 },
        { nome:"RECEBIMENTO (SAÚDE)",                   cor:0x2e6f77, frac:0.07 },
        { nome:"RECEBIMENTO (PROMOCIONAL)",             cor:0x2e6f77, frac:0.09 },
        { nome:"ÁREA DE ACESSO / CONTROLE",             cor:0x6b6f74, frac:0.14 },
        { nome:"EXPEDIÇÃO (PROMOCIONAL)",               cor:0x8a4fb0, frac:0.28 },
        { nome:"SEPARAÇÃO/CONFERÊNCIA (PROMOCIONAL)",   cor:0x5a6b7a, frac:0.14 },
        { nome:"BLOCADO",                               cor:0xd4b106, frac:0.14 }
      ];
      let xCursor = 0;
      zonas.forEach(zn=>{
        const w = totalW * zn.frac;
        const mat = new THREE.MeshBasicMaterial({ color:zn.cor, transparent:true, opacity:0.4, depthWrite:false });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(0.5,w-0.4), depth-0.6), mat);
        plane.rotation.x = -Math.PI/2;
        plane.position.set(xCursor + w/2, 0.02, -depth/2);
        scene.add(plane);
        addFloorLabel(zn.nome, xCursor + w/2, -depth/2, { color:"#eef2f0", width: Math.min(w-1, 9) });
        xCursor += w;
      });
      // 12 docas reais (Doca 01 a Doca 12), conforme a planta — posição X
      // proporcional ao longo da mesma fachada das zonas acima.
      const numDocas = 12;
      for(let i=0;i<numDocas;i++){
        const x = (totalW/numDocas)*(i+0.5);
        addFloorLabel("DOCA " + String(i+1).padStart(2,"0"), x, -depth-0.9, { color:"#c9a24a", width:2.2 });
      }
    })(mainLayout);

    // ---------------------------------------------------------------------
    // Camada ÚNICA por posição OCUPADA: 1 palete + N caixas (uma pilha).
    // Posição sem material = simplesmente não existe aqui (nada é desenhado).
    // Palete e caixas compartilham o mesmo índice de entrada, então qualquer
    // filtro que oculte a posição oculta as DUAS coisas juntas.
    // ---------------------------------------------------------------------
    const hojeRef = new Date(); hojeRef.setHours(0,0,0,0);
    function buildOccupiedLayer(layout){
      const occupied = layout.positions.filter(p => layout.ruaX[p.rua] !== undefined);

      const palletSizeX = RACK_DEPTH*0.8, palletSizeZ = COL_SPACING*0.86;
      const palletGeo = new THREE.BoxGeometry(1,1,1);
      const palletMat = new THREE.MeshStandardMaterial({ roughness:0.92, metalness:0.0 });
      const palletMesh = new THREE.InstancedMesh(palletGeo, palletMat, Math.max(1, occupied.length));
      palletMesh.frustumCulled = false;

      const entries = occupied.map((p,i)=>{
        const x = layout.ruaX[p.rua];
        const z = (p.col - 0.5) * COL_SPACING;
        const palletY = BASE_LEVEL_Y + (p.niv-1)*LEVEL_HEIGHT + PALLET_HEIGHT/2 + 0.02;
        const baseY = BASE_LEVEL_Y + (p.niv-1)*LEVEL_HEIGHT + PALLET_HEIGHT + 0.03;
        const itemCount = p.itens.length;
        const risco = riscoValidadePosicao(p.itens, hojeRef);
        const danificado = p.itens.some(it=>isTruthy(it[8]));
        const tier = tierForItemCount(itemCount);
        return { data:p, index:i, x, z, palletY, baseY, itemCount, risco, danificado, tier, instanceIndices:[] };
      });

      const dummy = new THREE.Object3D();
      function writePalletMatrix(e, scaleMul){
        dummy.position.set(e.x, e.palletY, e.z);
        dummy.scale.set(palletSizeX*scaleMul, PALLET_HEIGHT*scaleMul, palletSizeZ*scaleMul);
        dummy.updateMatrix();
        palletMesh.setMatrixAt(e.index, dummy.matrix);
      }
      entries.forEach(e=>{ writePalletMatrix(e,1); palletMesh.setColorAt(e.index, COLOR_PALLET); });
      palletMesh.instanceMatrix.needsUpdate = true;
      if(palletMesh.instanceColor) palletMesh.instanceColor.needsUpdate = true;
      scene.add(palletMesh);

      const instances = [];
      entries.forEach(e=>{
        tierTemplate(e.tier).forEach(s=>{
          const idx = instances.length;
          instances.push({ entry:e, dx:s.dx, dz:s.dz, y0:s.y0, sx:s.sx, sy:s.sy, sz:s.sz });
          e.instanceIndices.push(idx);
        });
      });

      const boxGeo = new THREE.BoxGeometry(1,1,1);
      const boxMat = new THREE.MeshStandardMaterial({ roughness:0.85, metalness:0.02 });
      const mesh = new THREE.InstancedMesh(boxGeo, boxMat, Math.max(1, instances.length));
      mesh.frustumCulled = false;

      function writeInstance(i, scaleMul){
        const inst = instances[i];
        const e = inst.entry;
        dummy.position.set(e.x+inst.dx, e.baseY+inst.y0, e.z+inst.dz);
        dummy.scale.set(inst.sx*scaleMul, inst.sy*scaleMul, inst.sz*scaleMul);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      instances.forEach((inst,i)=>{
        writeInstance(i, 1);
        mesh.setColorAt(i, COLOR_PAPELAO[i % COLOR_PAPELAO.length]);
      });
      mesh.instanceMatrix.needsUpdate = true;
      if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);

      // placa de identificação VERTICAL, fixa na borda do palete voltada pro
      // corredor (não flutua, não vira pra câmera — orientação fixa de verdade)
      const posLabels = [];
      entries.forEach(e=>{
        const faceDir = layout.ruaFaceDir[e.data.rua] || 1;
        const decalW = 0.4;
        const labelX = e.x + faceDir * (palletSizeX/2 + 0.015);
        const labelY = e.palletY;
        const spr = addPalletDecal(String(e.data.pos), labelX, labelY, e.z, faceDir, decalW);
        posLabels.push(spr);
      });

      const posIndex = new Map();
      entries.forEach(e=>posIndex.set(e.data.pos, e));
      return { mesh, palletMesh, entries, instances, writeInstance, writePalletMatrix, posIndex, posLabels };
    }

    // ---------------------------------------------------------------------
    // Camada só pro filtro "Vazias": marcador branco na grade teórica menos
    // as posições ocupadas. Fica com escala 0 (invisível) até o filtro ligar.
    // ---------------------------------------------------------------------
    function buildEmptyHighlightLayer(layout){
      const slots = computeEmptySlots(layout).filter(s=>layout.ruaX[s.rua]!==undefined);
      const geo = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({ roughness:0.9, metalness:0.0 });
      const mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, slots.length));
      mesh.frustumCulled = false;
      const sizeX = RACK_DEPTH*0.92, sizeZ = COL_SPACING*0.92, sizeY = LEVEL_HEIGHT*0.85;
      const entries = slots.map((s,i)=>{
        const x = layout.ruaX[s.rua];
        const z = (s.col-0.5)*COL_SPACING;
        const y = BASE_LEVEL_Y + (s.niv-1)*LEVEL_HEIGHT + sizeY/2 + 0.05;
        return { index:i, x, y, z };
      });
      const dummy = new THREE.Object3D();
      function writeMatrix(e, scaleMul){
        dummy.position.set(e.x, e.y, e.z);
        dummy.scale.set(sizeX*scaleMul, sizeY*scaleMul, sizeZ*scaleMul);
        dummy.updateMatrix();
        mesh.setMatrixAt(e.index, dummy.matrix);
      }
      entries.forEach(e=>{ writeMatrix(e,0); mesh.setColorAt(e.index, COLOR_VAZIO); });
      mesh.instanceMatrix.needsUpdate = true;
      if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      scene.add(mesh);

      // placa de identificação VERTICAL de cada vazia — são MILHARES (cada
      // uma com textura própria), então NÃO cria tudo de cara: isso pesava
      // bastante no carregamento inicial pra algo que só aparece quando o
      // filtro "Vazias" é ligado. Fica adiado até a primeira vez que alguém
      // realmente ativa o filtro (ver ensureLabels/api.current.applyMode).
      const posLabels = [];
      let labelsBuilt = false;
      function ensureLabels(){
        if(labelsBuilt) return posLabels;
        labelsBuilt = true;
        slots.forEach((s,i)=>{
          const faceDir = layout.ruaFaceDir[s.rua] || 1;
          const x = layout.ruaX[s.rua];
          const z = (s.col-0.5)*COL_SPACING;
          const midY = entries[i].y;
          const decalW = 0.4;
          const labelX = x + faceDir * (sizeX/2 + 0.015);
          const spr = addPalletDecal(String(s.pos), labelX, midY, z, faceDir, decalW);
          spr.userData.emptyLabel = true;
          posLabels.push(spr);
        });
        return posLabels;
      }

      return { mesh, entries, writeMatrix, posLabels, ensureLabels };
    }

    const mainOccupied = buildOccupiedLayer(mainLayout);
    const ficticiaOccupied = ficticiaLayout ? buildOccupiedLayer(ficticiaLayout) : null;
    const allBoxLayers = ficticiaOccupied ? [mainOccupied, ficticiaOccupied] : [mainOccupied];
    const allPosLabels = allBoxLayers.flatMap(l=>l.posLabels);
    const combinedPosIndex = new Map();
    allBoxLayers.forEach(layer => layer.posIndex.forEach((v,k)=>combinedPosIndex.set(k, { layer, entry:v })));

    const emptyHighlight = buildEmptyHighlightLayer(mainLayout);
    allPosLabels.push(...emptyHighlight.posLabels);

    // severidade combinada de uma posição: prioriza vencido de verdade;
    // se estiver danificada e também perto de vencer, ainda conta como
    // "problema" pro contorno pulsante passivo (sem filtro ativo).
    function severityOf(entry){
      if(entry.risco === "vencido") return "vencido";
      if(entry.danificado) return entry.risco || "vencido";
      return entry.risco || null;
    }

    // contorno pulsante para posições com risco de validade (vencido/crítico/atenção) ou danificado
    // — é passivo (aparece mesmo sem filtro ativo, pra chamar atenção de longe)
    const RISCO_COR_HEX = { vencido:0xff5544, critico:0xff8c1a, atencao:0xf0c419 };
    const alertMeshes = [];
    allBoxLayers.forEach(layer=>{
      layer.entries.forEach(e=>{
        if(!e.risco && !e.danificado) return;
        const corHex = RISCO_COR_HEX[e.risco] || 0xff5544;
        const stackH = tierStackHeight(e.tier);
        const g = new THREE.BoxGeometry(RACK_DEPTH*0.85, stackH*1.15, COL_SPACING*0.85);
        const m = new THREE.MeshBasicMaterial({ color:corHex, transparent:true, opacity:0.5, wireframe:true });
        const mesh = new THREE.Mesh(g, m);
        mesh.position.set(e.x, e.baseY + stackH/2, e.z);
        mesh.userData.risco = e.risco || "vencido";
        scene.add(mesh);
        alertMeshes.push(mesh);
      });
    });

    /* ---------------------------------------------------------------------
       Estado de interação (hover / seleção / modo de visualização)
       --------------------------------------------------------------------- */
    let hoveredEntry = null, selectedEntry = null;
    let currentModeType = "none", currentModeValue = null;

    function entryMatchesMode(entry){
      if(currentModeType === "none" || currentModeType === "busca") return true;
      if(currentModeType === "vazio") return false; // posições ocupadas somem inteiras (palete+caixa) nesse filtro
      const itens = entry.data.itens;
      if(currentModeType === "vencido")     return entry.risco === "vencido";
      if(currentModeType === "danificado")  return itens.some(it => isTruthy(it[8]));
      if(currentModeType === "risco")       return !!entry.risco;
      if(currentModeType === "cliente")     return itens.some(it => String(it[0]||"").trim() === String(currentModeValue||"").trim());
      if(currentModeType === "familia")     return itens.some(it => String(it[10]||"").trim() === String(currentModeValue||"").trim());
      return true;
    }
    const FILTER_MODES = ["vencido","danificado","risco","cliente","familia","vazio"];
    // cor SÓLIDA (sem opacidade/mistura) de destaque do filtro ativo — null
    // significa "usar a cor padrão de papelão" (sem filtro).
    function entryHighlightColor(entry){
      if(currentModeType === "vencido" || currentModeType === "danificado" || currentModeType === "risco") return COLOR_VENCIDO_DANIFICADO;
      if(currentModeType === "cliente") return COLOR_CLIENTE_DESTAQUE;
      if(currentModeType === "familia") return new THREE.Color(corFamilia(currentModeValue));
      return null;
    }
    function refreshEntryVisual(layer, entry){
      const isFiltering = FILTER_MODES.includes(currentModeType);
      const matches = entryMatchesMode(entry);
      const visible = !isFiltering || matches;
      const scaleMul = !visible ? 0 : (entry===hoveredEntry || entry===selectedEntry ? 1.14 : 1);
      // o palete só existe (visualmente) enquanto a posição existe/combina com
      // o filtro — sem material ali, ou filtrada pra fora, some junto com a caixa
      layer.writePalletMatrix(entry, scaleMul);
      layer.palletMesh.setColorAt(entry.index, COLOR_PALLET);
      const highlightColor = entryHighlightColor(entry);
      entry.instanceIndices.forEach(i=>{
        layer.writeInstance(i, scaleMul);
        let color = highlightColor ? highlightColor.clone() : COLOR_PAPELAO[i % COLOR_PAPELAO.length].clone();
        if(entry===selectedEntry) color = color.lerp(COLOR_SELECT, 0.45);
        else if(entry===hoveredEntry) color = color.lerp(COLOR_HOVER, 0.4);
        layer.mesh.setColorAt(i, color);
      });
    }
    function refreshAllVisuals(){
      allBoxLayers.forEach(layer=>{
        layer.entries.forEach(e=>refreshEntryVisual(layer, e));
        layer.mesh.instanceMatrix.needsUpdate = true;
        if(layer.mesh.instanceColor) layer.mesh.instanceColor.needsUpdate = true;
        layer.mesh.material.needsUpdate = true;
        layer.palletMesh.instanceMatrix.needsUpdate = true;
        if(layer.palletMesh.instanceColor) layer.palletMesh.instanceColor.needsUpdate = true;
      });
    }
    refreshAllVisuals();

    // camada extra só do filtro "Vazias": mostra marcador branco sólido nas
    // posições da grade que realmente não têm nenhum registro de estoque.
    function refreshEmptyHighlight(){
      const vazioAtivo = currentModeType === "vazio";
      emptyHighlight.entries.forEach(e=> emptyHighlight.writeMatrix(e, vazioAtivo ? 1 : 0));
      emptyHighlight.mesh.instanceMatrix.needsUpdate = true;
    }
    refreshEmptyHighlight();

    // destaque de busca livre (não oculta, só realça e escurece o resto)
    function applyBuscaHighlight(matchSet){
      allBoxLayers.forEach(layer=>{
        layer.entries.forEach(e=>{
          const isMatch = matchSet && matchSet.has(e.data.pos);
          e.instanceIndices.forEach(i=>{
            let color = COLOR_PAPELAO[i % COLOR_PAPELAO.length].clone();
            if(matchSet){
              color = isMatch ? color.lerp(COLOR_HOVER, 0.5) : color.lerp(new THREE.Color(0x1a1d20), 0.6);
            }
            if(e===selectedEntry) color = color.lerp(COLOR_SELECT, 0.45);
            layer.mesh.setColorAt(i, color);
          });
        });
        layer.mesh.instanceColor && (layer.mesh.instanceColor.needsUpdate = true);
      });
    }

    api.current.applyMode = (m)=>{
      currentModeType = m.type;
      currentModeValue = m.value || null;
      if(m.type === "vazio"){
        const novasLabels = emptyHighlight.ensureLabels();
        // se acabaram de ser criadas agora, entra pro array geral de culling
        novasLabels.forEach(l=>{ if(!allPosLabels.includes(l)) allPosLabels.push(l); });
      }
      if(m.type === "busca"){
        refreshAllVisuals();
        const q = m.value.toUpperCase();
        const matchSet = new Set();
        allBoxLayers.forEach(layer=>layer.entries.forEach(e=>{
          const p = e.data;
          const hit = p.pos.toUpperCase().includes(q) ||
            p.itens.some(it => (it[0]||"").toUpperCase().includes(q) || (it[1]||"").toUpperCase().includes(q) || (it[2]||"").toUpperCase().includes(q));
          if(hit) matchSet.add(p.pos);
        }));
        applyBuscaHighlight(matchSet);
      } else {
        refreshAllVisuals();
      }
      refreshEmptyHighlight();
    };

    api.current.setSelectedByPos = (pos)=>{
      const found = pos ? combinedPosIndex.get(pos) : null;
      const newEntry = found ? found.entry : null;
      if(newEntry === selectedEntry) return;
      selectedEntry = newEntry;
      refreshAllVisuals();
      if(currentModeType === "busca") api.current.applyMode({ type:"busca", value: currentModeValue || "" });
    };

    /* ---------------------------------------------------------------------
       Câmera: órbita e caminhada (andar)
       --------------------------------------------------------------------- */
    const initialX = mainLayout.ruaX[mainLayout.ruas[0]] !== undefined ? mainLayout.ruaX[mainLayout.ruas[0]] : centerX;
    const orbitTarget = new THREE.Vector3(initialX, 1.7, Math.min(typicalDepth*0.35, mainLayout.totalDepth/2));
    const spherical = new THREE.Spherical(initialRadius, Math.PI/3.1, Math.PI*0.22);
    let radiusTarget = spherical.radius;      // zoom suavizado (lerp por frame)
    let thetaVelocity = 0, phiVelocity = 0;   // "momentum" do arraste — continua girando suave ao soltar

    const walk = { x: centerX, z: mainLayout.totalDepth/2, yaw: 0, pitch: 0, y: 1.6 };
    const keys = {};
    api.current.setKey = (k,v)=>{ keys[k]=v; };

    const clamp = (v,min,max)=>Math.max(min, Math.min(max, v));
    const clampOrbitTarget = ()=>{
      orbitTarget.x = clamp(orbitTarget.x, -40, totalWidthAll+40);
      orbitTarget.z = clamp(orbitTarget.z, -40, totalDepthAll+40);
    };
    const clampWalk = ()=>{
      walk.x = clamp(walk.x, -30, totalWidthAll+30);
      walk.z = clamp(walk.z, -10, totalDepthAll+10);
    };

    // ponteiros (arraste / pinça)
    const pointers = new Map();
    let dragging = false, lastX=0, lastY=0, dragDistance=0, dragButton=0;
    let pinchStartDist=null, pinchStartMid=null, pinchStartTarget=null;
    const dist2 = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
    const mid2 = (a,b)=>({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });

    const onPointerDown = (e)=>{
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(pointers.size===1){ dragging=true; lastX=e.clientX; lastY=e.clientY; dragDistance=0; thetaVelocity=0; phiVelocity=0; dragButton=e.button; }
      else if(pointers.size===2){
        dragging=false;
        const pts = Array.from(pointers.values());
        pinchStartDist = dist2(pts[0], pts[1]);
        pinchStartMid = mid2(pts[0], pts[1]);
        pinchStartTarget = orbitTarget.clone();
      }
    };
    const onPointerUp = (e)=>{
      pointers.delete(e.pointerId);
      if(pointers.size<2){ pinchStartDist=null; pinchStartMid=null; }
      if(pointers.size===0) dragging=false;
      else if(pointers.size===1){ const p=Array.from(pointers.values())[0]; dragging=true; lastX=p.x; lastY=p.y; }
    };
    const onPointerMove = (e)=>{
      if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
      if(pointers.size>=2 && viewModeRef.current==="orbit"){
        const pts = Array.from(pointers.values());
        const d = dist2(pts[0], pts[1]);
        const mid = mid2(pts[0], pts[1]);
        if(pinchStartDist!=null){ radiusTarget = clamp(radiusTarget + (pinchStartDist-d)*0.03, 4, maxOrbitRadius); pinchStartDist = d; }
        if(pinchStartMid && pinchStartTarget){
          const dx = mid.x - pinchStartMid.x, dy = mid.y - pinchStartMid.y;
          const theta = spherical.theta;
          const scale = spherical.radius*0.0028;
          orbitTarget.x = pinchStartTarget.x - Math.cos(theta)*dx*scale + (-Math.sin(theta))*dy*scale;
          orbitTarget.z = pinchStartTarget.z - (-Math.sin(theta))*dx*scale + (-Math.cos(theta))*dy*scale;
          clampOrbitTarget();
        }
        return;
      }
      const dx = e.clientX-lastX, dy = e.clientY-lastY;
      if(dragging){
        dragDistance += Math.abs(dx)+Math.abs(dy);
        if(viewModeRef.current==="orbit" && (e.ctrlKey || dragButton===2)){
          // Ctrl + arraste do mouse = "andar" pelo corredor sem precisar
          // trocar de modo — desloca o alvo da câmera (pan) na direção que
          // você arrasta, em vez de girar.
          thetaVelocity = 0; phiVelocity = 0;
          const theta = spherical.theta;
          const scale = spherical.radius*0.0032;
          orbitTarget.x -= (Math.cos(theta)*dx - Math.sin(theta)*dy) * scale;
          orbitTarget.z -= (-Math.sin(theta)*dx - Math.cos(theta)*dy) * scale;
          clampOrbitTarget();
        } else if(viewModeRef.current==="orbit"){
          const dTheta = -dx*0.008, dPhi = dy*0.008;
          spherical.theta += dTheta;
          spherical.phi = clamp(spherical.phi + dPhi, 0.15, Math.PI/2.05);
          // guarda a velocidade do último movimento pra "soltar e continuar girando" suave
          thetaVelocity = dTheta*0.6;
          phiVelocity = dPhi*0.6;
        } else {
          walk.yaw -= dx*0.0045;
          walk.pitch = clamp(walk.pitch - dy*0.0045, -1.1, 1.1);
        }
      }
      lastX = e.clientX; lastY = e.clientY;
    };
    const onWheel = (e)=>{
      e.preventDefault();
      if(viewModeRef.current==="orbit") radiusTarget = clamp(radiusTarget + e.deltaY*0.02, 4, maxOrbitRadius);
    };
    const onKeyDown = (e)=>{ keys[e.code]=true; };
    const onKeyUp   = (e)=>{ keys[e.code]=false; };

    const onContextMenu = (e)=>{ e.preventDefault(); };

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    window.addEventListener("pointerup", onPointerUp);
    window.addEventListener("pointercancel", onPointerUp);
    window.addEventListener("pointermove", onPointerMove);
    renderer.domElement.addEventListener("wheel", onWheel, { passive:false });
    renderer.domElement.addEventListener("contextmenu", onContextMenu);
    window.addEventListener("keydown", onKeyDown);
    window.addEventListener("keyup", onKeyUp);
    renderer.domElement.style.touchAction = "none";

    const raycaster = new THREE.Raycaster();
    const pointerNdc = new THREE.Vector2();
    const updatePointerNdc = (e)=>{
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNdc.x = (e.clientX-rect.left)/rect.width*2-1;
      pointerNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    };
    renderer.domElement.addEventListener("mousemove", updatePointerNdc);

    const onClick = ()=>{
      if(dragDistance>6) return;
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(allBoxLayers.map(l=>l.mesh));
      if(hits.length>0){
        const hitMesh = hits[0].object;
        const layer = allBoxLayers.find(l=>l.mesh===hitMesh);
        const entry = layer.instances[hits[0].instanceId].entry;
        if(!entryMatchesMode(entry) && FILTER_MODES.includes(currentModeType)) return;
        setSelected(prev => (prev && prev.pos===entry.data.pos) ? null : entry.data);
      }
    };

    // zoom suavizado e zera o momentum de arraste (senão ele "herdaria"
    // velocidade de um arraste anterior e continuaria girando sozinho)
    const syncCameraTargets = ()=>{ radiusTarget = spherical.radius; thetaVelocity = 0; phiVelocity = 0; };

    // foca a câmera numa posição específica (clique na lista de busca ou no bloco)
    api.current.focusCamera = (pos)=>{
      const layer = mainLayout.ruaX[pos.rua]!==undefined ? mainLayout : ficticiaLayout;
      const x = layer.ruaX[pos.rua];
      const z = (pos.col-0.5)*COL_SPACING;
      const y = BASE_LEVEL_Y + (pos.niv-1)*LEVEL_HEIGHT + 1;
      orbitTarget.set(x, y, z);
      spherical.radius = 6; spherical.phi = Math.PI/4; spherical.theta = Math.PI/3;
      syncCameraTargets();

    };

    // pula pro INÍCIO da rua, olhando de frente pra ela — vendo a plaquinha
    // com o nome/número (que fica em z=-1.4, antes da coluna 1)
    api.current.jumpToRua = (rua)=>{
      const layer = mainLayout.ruaX[rua]!==undefined ? mainLayout : ficticiaLayout;

    api.current.jumpToFicticio = ()=>{

    api.current.resetView = ()=>{

      // olhando ao longo do comprimento das ruas — vê todas lado a lado
      // com os números, tipo "parado na entrada olhando pros corredores"
      const overviewX = mainLayout.totalWidth/2 - mainLayout.corridorSpanX/2;
      const overviewZ = Math.min(10, mainLayout.totalDepth*0.12);
      orbitTarget.set(overviewX, 3, overviewZ);
      spherical.radius = clamp(mainLayout.totalWidth*0.8 + 22, initialRadius, maxOrbitRadius);
      spherical.theta = Math.PI;
      spherical.phi = Math.PI/2.4;

      setViewMode("orbit");

    // galpão) — mantido como alias pra oferecer os 3 presets de câmera
    // (Superior/Frontal/Lateral) de forma consistente na barra de botões.
    api.current.viewFrontal = ()=> api.current.resetView();
    // câmera vertical, olhando o galpão de cima (planta baixa) — útil pra
    // ver a disposição geral das ruas de uma vez, como na "Visão 2D" de
    // referência, mas ainda dentro da cena 3D (sem trocar de modo de visão).
    api.current.viewSuperior = ()=>{
      const overviewX = mainLayout.totalWidth/2 - mainLayout.corridorSpanX/2;
      const overviewZ = mainLayout.totalDepth/2;
      orbitTarget.set(overviewX, 0, overviewZ);
      spherical.radius = clamp(Math.max(mainLayout.totalWidth, mainLayout.totalDepth)*0.78 + 14, initialRadius, maxOrbitRadius);
      spherical.theta = Math.PI/2;
      spherical.phi = 0.12; // quase direto de cima, evitando o gimbal lock em phi=0
      syncCameraTargets();
      setViewMode("orbit");
    };
    // câmera lateral, olhando o galpão de lado (perpendicular às ruas) —
    // dá pra ver a profundidade/comprimento das ruas de uma vez.
    api.current.viewLateral = ()=>{
      const overviewX = mainLayout.totalWidth/2 - mainLayout.corridorSpanX/2;
      const overviewZ = Math.min(10, mainLayout.totalDepth*0.12);
      orbitTarget.set(overviewX, 3, overviewZ);
      spherical.radius = clamp(mainLayout.totalWidth*0.8 + 22, initialRadius, maxOrbitRadius);
      spherical.theta = Math.PI/2;
      spherical.phi = Math.PI/2.4;
      syncCameraTargets();
      setViewMode("orbit");
    };

    // Sempre que o modo "Andar" é ativado, a câmera passa a olhar para o
    // MEIO da faixa de posições (não para um lugar aleatório da cena).
    api.current.onModeChange = (m)=>{
      if(m === "walk"){
        walk.x = clamp(orbitTarget.x, -30, totalWidthAll+30);
        walk.z = mainLayout.totalDepth/2; // sempre o meio das posições
        walk.y = 1.6;
        walk.yaw = 0;
        walk.pitch = 0;
        clampWalk();
      } else {
        orbitTarget.set(walk.x, 1.7, walk.z);
        spherical.radius = 9; spherical.theta = walk.yaw + Math.PI; spherical.phi = Math.PI/3;
        syncCameraTargets();
        clampOrbitTarget();
      }
    };

    /* ---------------------------------------------------------------------
       Loop de renderização
       --------------------------------------------------------------------- */
    let rafId;
    const clock = new THREE.Clock();
    let elapsed = 0;
    const LABEL_VISIBLE_DIST2 = 13*13; // só mostra a plaquinha da posição perto da câmera
    let labelCullCounter = 0;
    const animate = ()=>{
      rafId = requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      elapsed += dt;

      if(viewModeRef.current === "orbit"){
        // zoom suavizado (aproxima o raio atual do alvo aos poucos)
        spherical.radius += (radiusTarget - spherical.radius) * Math.min(1, dt*10);
        // momentum: se não está arrastando agora, continua girando com a
        // velocidade do último movimento, decaindo suavemente até parar
        if(!dragging && (Math.abs(thetaVelocity) > 0.00005 || Math.abs(phiVelocity) > 0.00005)){
          spherical.theta += thetaVelocity;
          spherical.phi = clamp(spherical.phi + phiVelocity, 0.15, Math.PI/2.05);
          thetaVelocity *= 0.9;
          phiVelocity *= 0.9;
        }
        const offset = new THREE.Vector3().setFromSpherical(spherical);
        camera.position.copy(orbitTarget).add(offset);
        camera.lookAt(orbitTarget);
      } else {
        const speed = (keys.ShiftLeft || keys.run ? 8 : 4.2) * dt;
        const fwd = new THREE.Vector3(Math.sin(walk.yaw), 0, Math.cos(walk.yaw));
        const right = new THREE.Vector3(Math.cos(walk.yaw), 0, -Math.sin(walk.yaw));
        if(keys.KeyW || keys.ArrowUp)    { walk.x -= fwd.x*speed;   walk.z -= fwd.z*speed; }
        if(keys.KeyS || keys.ArrowDown)  { walk.x += fwd.x*speed;   walk.z += fwd.z*speed; }
        if(keys.KeyA || keys.ArrowLeft)  { walk.x -= right.x*speed; walk.z -= right.z*speed; }
        if(keys.KeyD || keys.ArrowRight) { walk.x += right.x*speed; walk.z += right.z*speed; }
        clampWalk();
        camera.position.set(walk.x, walk.y, walk.z);
        const look = new THREE.Vector3(
          -Math.sin(walk.yaw)*Math.cos(walk.pitch),
          Math.sin(walk.pitch),
          -Math.cos(walk.yaw)*Math.cos(walk.pitch)
        );
        camera.lookAt(walk.x+look.x, walk.y+look.y, walk.z+look.z);
      }

      // hover
      raycaster.setFromCamera(pointerNdc, camera);
      const hits = raycaster.intersectObjects(allBoxLayers.map(l=>l.mesh));
      const hit = hits.length>0 ? hits[0] : null;
      const hitEntry = hit ? allBoxLayers.find(l=>l.mesh===hit.object).instances[hit.instanceId].entry : null;
      if(hitEntry !== hoveredEntry){
        const prev = hoveredEntry;
        hoveredEntry = hitEntry;
        if(prev){ const layer = allBoxLayers.find(l=>l.entries.includes(prev)); refreshEntryVisual(layer, prev); layer.mesh.instanceMatrix.needsUpdate=true; layer.mesh.instanceColor && (layer.mesh.instanceColor.needsUpdate=true); }
        if(hoveredEntry){ const layer = allBoxLayers.find(l=>l.entries.includes(hoveredEntry)); refreshEntryVisual(layer, hoveredEntry); layer.mesh.instanceMatrix.needsUpdate=true; layer.mesh.instanceColor && (layer.mesh.instanceColor.needsUpdate=true); }
        mount.style.cursor = hoveredEntry ? "pointer" : (viewModeRef.current==="walk" ? "crosshair" : "grab");
      }

      // o contorno pulsante é só um "sinal de longe" passivo, pra quando
      // NENHUM filtro está ativo. Assim que um filtro entra, o destaque
      // passa a ser 100% a cor sólida da caixa — o contorno some, pra não
      // competir visualmente com o preenchimento.
      const shouldPulse = currentModeType === "none";
      const pulse = 0.35 + Math.sin(elapsed*4)*0.25;
      alertMeshes.forEach(m=>{
        m.visible = shouldPulse;
        if(shouldPulse) m.material.opacity = pulse;
      });

      // plaquinhas de identificação: só ficam visíveis perto da câmera
      // (recalculado a cada poucos quadros, não em todo frame, para custar
      // menos processamento)
      labelCullCounter++;
      if(labelCullCounter % 6 === 0){
        const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
        const vazioAtivo = currentModeType === "vazio";
        allPosLabels.forEach(spr=>{
          if(spr.userData.emptyLabel && !vazioAtivo){ spr.visible = false; return; }
          const dx = spr.position.x-cx, dy = spr.position.y-cy, dz = spr.position.z-cz;
          spr.visible = (dx*dx + dy*dy + dz*dz) < LABEL_VISIBLE_DIST2;
        });
      }

      renderer.render(scene, camera);
    };
    animate();

    const onResize = ()=>{
      const w = mount.clientWidth, hgt = mount.clientHeight;
      camera.aspect = w/hgt;
      camera.updateProjectionMatrix();
      renderer.setSize(w, hgt);
    };
    window.addEventListener("resize", onResize);

    api.current.cleanup = ()=>{
      cancelAnimationFrame(rafId);
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointerup", onPointerUp);
      window.removeEventListener("pointercancel", onPointerUp);
      window.removeEventListener("pointermove", onPointerMove);
      window.removeEventListener("keydown", onKeyDown);
      window.removeEventListener("keyup", onKeyUp);
      renderer.domElement.removeEventListener("pointerdown", onPointerDown);
      renderer.domElement.removeEventListener("wheel", onWheel);
      renderer.domElement.removeEventListener("contextmenu", onContextMenu);
      renderer.domElement.removeEventListener("mousemove", updatePointerNdc);
      renderer.domElement.removeEventListener("click", onClick);
      renderer.dispose();
      if(mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
    return ()=> api.current.cleanup && api.current.cleanup();
  }, [data, mainLayout, ficticiaLayout]);

  /* =======================================================================
     RENDER (React) — camada de UI sobre o canvas 3D
     ======================================================================= */
  if(error){
    return h("div", { style:{ display:"flex", alignItems:"center", justifyContent:"center", height:"100vh",
      color:PAL.venc, fontFamily:"system-ui", fontSize:14, textAlign:"center", padding:20, background:PAL.paper } },
      h("div", null, "Erro ao carregar estoque.json: ", error, h("br",null),

    return h("div", { style:{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
      height:"100vh", color:PAL.ink2, fontFamily:"system-ui", fontSize:14, gap:12, background:PAL.paper } },
      h("div", null, "Carregando armazém... ", progress>0 ? progress+"%" : ""),
      h("div", { style:{ width:220, height:6, borderRadius:3, background:PAL.semBg, overflow:"hidden" } },
        h("div", { style:{ width:progress+"%", height:"100%", background:"linear-gradient(90deg, " + PAL.navy + ", " + PAL.azure + ")", transition:"width 0.2s" } })),
      h("div", { style:{ fontSize:11, color:PAL.mute } }, "Baixando dados do estoque (~3.7 MB)"));
  }

  const dpadBtnStyle = { width:52, height:52, borderRadius:"50%", border:"1px solid rgba(255,255,255,0.15)",
    background:"rgba(20,24,28,0.85)", color:"#f4efe6", fontSize:20, display:"flex", alignItems:"center",
    justifyContent:"center", userSelect:"none", touchAction:"none" };
  const dpadHandlers = (code)=>({
    onPointerDown:(e)=>{ e.preventDefault(); api.current.setKey && api.current.setKey(code, true); },
    onPointerUp:(e)=>{ e.preventDefault(); api.current.setKey && api.current.setKey(code, false); },
    onPointerLeave:()=>{ api.current.setKey && api.current.setKey(code, false); },
    onPointerCancel:()=>{ api.current.setKey && api.current.setKey(code, false); },

  const filterBtnStyle = (active, color)=>({
    background: active ? color : "rgba(255,255,255,0.08)",
    color:"#f4efe6", border:"none", borderRadius:6, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer"
  });

  const inputBaseStyle = { padding:"6px 10px", borderRadius:6, border:"1px solid rgba(255,255,255,0.15)",
    background:"rgba(20,24,28,0.9)", color:"#f4efe6", fontSize:12, outline:"none" };

  return h("div", { style:{ width:"100%", height:"100vh", display:"flex", flexDirection: isMobile ? "column" : "row",
    background:PAL.paper, fontFamily:"'Inter', system-ui, sans-serif", overflow:"hidden" } },

    h(AppNav, { page, setPage, isMobile }),

    h("div", { style:{ flex:"1 1 auto", minWidth:0, minHeight:0, display:"flex", flexDirection:"column", height:"100%" } },

    // --- barra superior (fica no fluxo normal da página: nunca sobrepõe o resto) ---
    h("div", { style:{ flex:"0 0 auto", display:"flex", justifyContent:"space-between", alignItems:"flex-start",

      borderBottom:"1px solid rgba(120,175,255,0.22)" } },

        h("h1", { style:{ margin:0, fontSize: isMobile?16:20,

          letterSpacing:"-0.02em", fontFamily:"'JetBrains Mono', monospace" } }, "ARMAZÉM 3D — PS LOGÍSTICA"),

          data.length.toLocaleString("pt-BR"), " posições · ", totalItens.toLocaleString("pt-BR"), " lotes/SKUs · ",

          )

        h("button", { onClick:()=>setInfoOpen(o=>!o), style:{ background: infoOpen ? "#fff" : "rgba(255,255,255,0.12)",
          color: infoOpen ? PAL.navy : "#fff", border:"none", borderRadius:6, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" } }, "ℹ️ Dados do galpão"),
        h("button", { onClick:()=>setFiltrosAvOpen(o=>!o), style:{ background: filtrosAvOpen ? "#fff" : "rgba(255,255,255,0.12)",
          color: filtrosAvOpen ? PAL.navy : "#fff", border:"none", borderRadius:6, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" } }, "☰ Filtros avançados"),
        h("button", { onClick: resetView, title:"Visão geral (padrão)", style:{ background:"rgba(255,255,255,0.12)", color:"#fff", border:"none",
          borderRadius:6, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" } }, "🏠 Visão geral"),
        h("div", { style:{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,0.22)" } },
          h("button", { onClick: viewSuperior, title:"Câmera de cima (planta)", style:{ background:"rgba(255,255,255,0.12)",
            color:"#fff", border:"none", padding:"6px 10px", fontSize:11.5, fontWeight:600, cursor:"pointer" } }, "Superior"),
          h("button", { onClick: viewFrontal, title:"Câmera de frente pro galpão", style:{ background:"rgba(255,255,255,0.12)",
            color:"#fff", border:"none", borderLeft:"1px solid rgba(255,255,255,0.22)", padding:"6px 10px", fontSize:11.5, fontWeight:600, cursor:"pointer" } }, "Frontal"),
          h("button", { onClick: viewLateral, title:"Câmera de lado, olhando o comprimento das ruas", style:{ background:"rgba(255,255,255,0.12)",
            color:"#fff", border:"none", borderLeft:"1px solid rgba(255,255,255,0.22)", padding:"6px 10px", fontSize:11.5, fontWeight:600, cursor:"pointer" } }, "Lateral")
        ),
        h("div", { style:{ display:"flex", borderRadius:6, overflow:"hidden", border:"1px solid rgba(255,255,255,0.22)" } },
          h("button", { onClick:()=>setVisao2D(false), style:{ background: !visao2D ? "#fff" : "rgba(255,255,255,0.12)",
            color: !visao2D ? PAL.navy : "#fff", border:"none", padding:"6px 10px", fontSize:11.5, fontWeight:600, cursor:"pointer" } }, "Visão 3D"),
          h("button", { onClick:()=>setVisao2D(true), style:{ background: visao2D ? "#fff" : "rgba(255,255,255,0.12)",
            color: visao2D ? PAL.navy : "#fff", border:"none", borderLeft:"1px solid rgba(255,255,255,0.22)", padding:"6px 10px", fontSize:11.5, fontWeight:600, cursor:"pointer" } }, "Visão 2D")
        ),
        [["orbit","🖱️ Órbita"], ["walk","🚶 Andar"]].map(([m,label]) =>
          h("button", { key:m, onClick:()=>setViewMode(m), style:{ background: viewMode===m ? "#fff" : "rgba(255,255,255,0.12)",
            color: viewMode===m ? PAL.navy : "#fff", border:"none", borderRadius:6, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" } }, label))
      )
    ),

    // --- barra de KPIs (indicadores gerais do galpão, sempre sobre os dados atuais) ---
    kpis && h("div", { style:{ flex:"0 0 auto", display:"flex", gap: isMobile?6:10, overflowX:"auto",
      padding: isMobile ? "8px 10px" : "10px 20px", background: PAL.paper,
      borderBottom:"1px solid " + PAL.line } },
      [
        { label:"Endereços", valor: kpis.capacidade.toLocaleString("pt-BR"), cor:PAL.navy, cor2:PAL.royal },
        { label:"Ocupados", valor: kpis.ocupadas.toLocaleString("pt-BR"), cor:"#12A593", cor2:"#0A6F64" },
        { label:"Vazios", valor: kpis.vazias.toLocaleString("pt-BR"), cor:PAL.mute, cor2:"#52607A" },
        { label:"Ocupação", valor: kpis.pctOcupacao + "%", cor:"#E5A112", cor2:"#B97C00" },
        { label:"Vencidos", valor: kpis.vencidas.toLocaleString("pt-BR"), cor:"#D8395A", cor2:"#A21F40" },
        { label:"A vencer ≤15d", valor: kpis.aVencer.toLocaleString("pt-BR"), cor:"#E5A112", cor2:"#B97C00" },
        { label:"Danificados", valor: kpis.danificadas.toLocaleString("pt-BR"), cor:"#D8395A", cor2:"#A21F40" }
      ].map(k => h("div", { key:k.label, style:{ position:"relative", overflow:"hidden", flex:"0 0 auto", minWidth: isMobile?84:100,
          background: PAL.cardGrad, border:"1px solid " + PAL.line,
          borderRadius:8, padding: isMobile?"6px 10px":"8px 14px", boxShadow:PAL.cardShadow } },
        h("div", { style:{ position:"absolute", left:0, right:0, top:0, height:3, background:"linear-gradient(90deg, " + k.cor + ", " + k.cor2 + ")" } }),
        h("div", { style:{ fontSize: isMobile?15:19, fontWeight:700, fontFamily:"'JetBrains Mono', monospace", lineHeight:1.2,
          background:"linear-gradient(180deg, " + k.cor + ", " + k.cor2 + ")", WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" } }, k.valor),
        h("div", { style:{ fontSize: isMobile?9.5:10.5, color:PAL.mute, marginTop:1 } }, k.label)
      ))
    ),

    page!=="3d" && h(PaginaFn[page], { data, kpis, isMobile, onSelectPos: selectPosByString }),

    // --- barra de ruas (atalhos) com indicador de ocupação — também no fluxo normal ---
    page==="3d" && h("div", { style:{ flex:"0 0 auto", display:"flex", gap:4, overflowX:"auto",
      padding: isMobile ? "6px 10px" : "6px 20px", background:"rgba(13,16,19,0.97)",
      borderBottom:"1px solid rgba(255,255,255,0.06)" } },
      mainLayout.ruas.map(r => {
        const oc = ocupacaoPorRua[r] || { ocupado:0, capacidade:0, pct:0 };
        const pctShow = Math.round(oc.pct*100);
        // verde (livre) -> amarelo -> vermelho (lotado)
        const barColor = oc.pct < 0.6 ? "#2e8b57" : oc.pct < 0.85 ? "#e8a13a" : "#c0392b";
        return h("button", { key:r, onClick:()=>jumpToRua(r), title: "Rua " + r + ": " + oc.ocupado + "/" + oc.capacidade + " posições ocupadas (" + pctShow + "%)",
          style:{ flex:"0 0 auto", padding:"4px 10px 6px", borderRadius:10, fontSize:11, fontWeight:600,
          border:"1px solid rgba(255,255,255,0.12)", background:"rgba(20,24,28,0.75)", color:"#e8a13a",
          cursor:"pointer", display:"flex", flexDirection:"column", alignItems:"center", gap:3, minWidth:38 } },
          h("span", null, r),
          h("div", { style:{ width:26, height:4, borderRadius:2, background:"rgba(255,255,255,0.12)", overflow:"hidden" } },
            h("div", { style:{ width: pctShow+"%", height:"100%", background:barColor } })),
          h("span", { style:{ fontSize:8, color:"#6b6f74", fontWeight:400 } }, pctShow+"%")
        );
      }),
      ficticiaLayout && h("button", { onClick: jumpToFicticio, style:{ flex:"0 0 auto", padding:"4px 10px",
        borderRadius:14, fontSize:11, fontWeight:600, border:"1px solid rgba(217,164,255,0.4)",
        background:"rgba(106,75,138,0.35)", color:"#d9a4ff", cursor:"pointer", alignSelf:"center" } }, "\u26A0 Bloco fictício")
    ),

    // --- área principal: viewport 3D + tudo que flutua por cima dela ---
    // Fica sempre montada (nunca desmonta o mountRef!) — o efeito do Three.js que cria o
    // renderer e anexa o <canvas> a esse div só roda 1x (depende só de data/mainLayout), então
    // desmontar/remontar esse container deixaria o canvas "órfão" ao voltar pra essa página.
    // Por isso só escondemos com CSS (display:none) quando a página não é "3d".
    h("div", { style:{ position:"relative", flex:"1 1 auto", minHeight:0, overflow:"hidden",
      display: page==="3d" ? "block" : "none" } },

      visao2D && h(Visao2DGrid, { grid2D, onSelectPos: selectPosByString, isMobile, mode, modeLabel, filtroNivel,
        onJumpRua: (rua)=>{ setVisao2D(false); jumpToRua(rua); } }),
      h(FiltrosAvancadosPanel, { open: filtrosAvOpen, onClose:()=>setFiltrosAvOpen(false), isMobile,
        ruas: mainLayout.ruas, niveisDisponiveis, filtroRuaDe, setFiltroRuaDe, filtroRuaAte, setFiltroRuaAte,
        filtroNivel, setFiltroNivel, mode, toggleMode }),

      // --- legenda ---
      !(isMobile && viewMode==="walk") && h("div", { style:{ position:"absolute", bottom:16, left: isMobile?12:20, zIndex:10,
        background:"rgba(20,24,28,0.85)", padding: isMobile ? "8px 10px" : "10px 14px", borderRadius:8,
        fontSize: isMobile?10:11, color:"#a8a29a", pointerEvents:"none", maxWidth: isMobile ? 220 : 340 } },
        h("div", { style:{ marginBottom:4 } },
          h("span", { style:{ display:"inline-block", width:10, height:10, background:"#c9a06a", borderRadius:2, marginRight:4, verticalAlign:"middle" } }),
          "Palete \xB7 ",
          h("span", { style:{ display:"inline-block", width:10, height:10, background:"#caa06e", borderRadius:2, margin:"0 4px 0 8px", verticalAlign:"middle" } }),
          "Caixas (volume aproximado pela qtd. de lotes/SKUs)"),
        h("div", { style:{ marginBottom:4 } }, "Contorno pulsante: ",
          h("span", { style:{ color:"#ff8a80" } }, "vermelho"), "=vencido \xB7 ",
          h("span", { style:{ color:"#ff8c1a" } }, "laranja"), "\u22647d \xB7 ",
          h("span", { style:{ color:"#f0d060" } }, "amarelo"), "\u226415d"),
        h("div", null, "Filtros pintam sólido: ",
          h("span", { style:{ color:"#ffd400" } }, "amarelo"), "=cliente \xB7 ",
          h("span", { style:{ color:"#ff8a80" } }, "vermelho"), "=vencido/danificado/a vencer \xB7 branco=vazia"),
        !isMobile && h("div", { style:{ marginTop:6, opacity:0.8 } },
          viewMode==="orbit" ? "Órbita: arraste para girar \xB7 Ctrl+arraste (mouse) p/ andar pelo corredor \xB7 2 dedos p/ mover e afastar/aproximar \xB7 toque num bloco"
                              : "Andar: use as setas na tela (ou WASD) \xB7 arraste p/ olhar \xB7 toque num bloco")
      ),

      // --- viewport 3D ---
      h("div", { ref: mountRef, style:{ width:"100%", height:"100%", cursor: viewMode==="walk" ? "crosshair" : "grab" } }),

      // --- controles de caminhada ---
      viewMode==="walk" && h("div", { style:{ position:"absolute", top: isMobile?12:16, left: isMobile?12:20, zIndex:10,
        display:"flex", gap:6 } },
        h("button", { onClick:()=>setWalkInputMode("mouse"), style:{ padding:"6px 12px", borderRadius:6,
          border:"none", background: walkInputMode==="mouse" ? "#2a6f77" : "rgba(20,24,28,0.85)",
          color:"#f4efe6", fontSize:12, fontWeight:600, cursor:"pointer" } }, "\u{1F5B1}\uFE0F Mouse"),
        h("button", { onClick:()=>setWalkInputMode("teclado"), style:{ padding:"6px 12px", borderRadius:6,
          border:"none", background: walkInputMode==="teclado" ? "#2a6f77" : "rgba(20,24,28,0.85)",
          color:"#f4efe6", fontSize:12, fontWeight:600, cursor:"pointer" } }, "\u2328\uFE0F Teclado")
      ),

      viewMode==="walk" && walkInputMode==="mouse" && h("div", { style:{ position:"absolute", bottom: isMobile?16:24, right: isMobile?16:24, zIndex:10 } },
        h("div", { style:{ display:"grid", gridTemplateColumns:"repeat(3, 52px)", gridTemplateRows:"repeat(2, 52px)", gap:6, justifyItems:"center" } },
          h("div", null), h("button", { style:dpadBtnStyle, ...dpadHandlers("KeyW") }, "\u25B2"), h("div", null),
          h("button", { style:dpadBtnStyle, ...dpadHandlers("KeyA") }, "\u25C0"),
          h("button", { style:dpadBtnStyle, ...dpadHandlers("KeyS") }, "\u25BC"),
          h("button", { style:dpadBtnStyle, ...dpadHandlers("KeyD") }, "\u25B6")),
        h("button", { style:{ ...dpadBtnStyle, width:"100%", borderRadius:10, marginTop:8, fontSize:12 }, ...dpadHandlers("run") }, "\u{1F3C3} Correr"),
        h("div", { style:{ marginTop:8, fontSize:10, color:"#a8a29a", textAlign:"center", maxWidth:170 } }, "Arraste a tela p/ olhar ao redor \xB7 use as setas pra andar")),

      viewMode==="walk" && walkInputMode==="teclado" && h("div", { style:{ position:"absolute", bottom: isMobile?16:24, right: isMobile?16:24, zIndex:10,
        background:"rgba(20,24,28,0.88)", borderRadius:10, padding:"12px 16px", color:"#f4efe6", fontSize:12, maxWidth:200 } },
        h("div", { style:{ fontWeight:700, marginBottom:6 } }, "\u2328\uFE0F Controles do teclado"),
        h("div", null, "W A S D ou setas \u2014 andar"),
        h("div", null, "Shift \u2014 correr"),
        h("div", { style:{ marginTop:4, color:"#a8a29a" } }, "Arraste o mouse na tela p/ olhar ao redor")),

      h(DetailPanel, { selected, onClose:()=>setSelected(null) }),
      h(InfoGalpaoPanel, { open: infoOpen, onClose:()=>setInfoOpen(false), isMobile }),
    )
    ) // fecha a coluna de conteúdo (título + KPIs + páginas) ao lado do AppNav
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(h(Armazem3D, null));
</script>
</body>
</html>
